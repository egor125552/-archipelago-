name: PR browser audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests three times
        run: |
          npm test
          npm test
          npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/wrangler.log
          exit 1
      - name: Repeat player scenario
        shell: bash
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          for (let attempt = 1; attempt <= 3; attempt++) {
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            try {
              console.log(`ATTEMPT ${attempt} START`);
              await page.goto('http://127.0.0.1:8787/free-roam.html');
              await page.locator('#hostButton').click();
              await page.locator('#game').waitFor({ state: 'visible', timeout: 15000 });
              const beforeText = (await page.locator('#speedValue').textContent() || '0').trim();
              const before = Number(beforeText.replace(',', '.'));
              await page.keyboard.down('ArrowUp');
              await page.waitForTimeout(1400);
              await page.keyboard.up('ArrowUp');
              await page.waitForTimeout(250);
              const movingText = (await page.locator('#speedValue').textContent() || '0').trim();
              const moving = Number(movingText.replace(',', '.'));
              console.log(`ATTEMPT ${attempt} SPEED ${beforeText} -> ${movingText}`);
              assert.ok(Number.isFinite(moving) && moving > before, `throttle failed ${beforeText} -> ${movingText}`);
              await page.keyboard.press('Space');
              await page.waitForTimeout(1200);
              const stoppedText = (await page.locator('#speedValue').textContent() || '0').trim();
              const stopped = Number(stoppedText.replace(',', '.'));
              console.log(`ATTEMPT ${attempt} BRAKE ${movingText} -> ${stoppedText}`);
              assert.ok(Number.isFinite(stopped) && stopped < moving, `brake failed ${movingText} -> ${stoppedText}`);
              await page.keyboard.press('q');
              await page.waitForTimeout(300);
              const target = (await page.locator('#targetValue').textContent() || '').trim();
              const message = (await page.locator('#message').textContent() || '').trim();
              console.log(`ATTEMPT ${attempt} SONAR target=${JSON.stringify(target)} message=${JSON.stringify(message)}`);
              assert.equal(errors.length, 0, errors.join(' | '));
              await page.locator('#leaveButton').click();
              await page.locator('#lobby').waitFor({ state: 'visible' });
              console.log(`ATTEMPT ${attempt} PASS`);
            } catch (e) {
              console.error(`ATTEMPT ${attempt} FAIL ${e.stack || e}`);
              failures.push(`attempt ${attempt}: ${e.stack || e}`);
            }
            await context.close();
          }
          await browser.close();
          console.log(`SUMMARY failures=${failures.length}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node /tmp/audit.mjs 2>&1 | tee /tmp/browser-output.txt
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-output
          path: |
            /tmp/browser-output.txt
            /tmp/wrangler.log
          if-no-files-found: warn
