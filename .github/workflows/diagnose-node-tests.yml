name: Diagnose Node tests

on:
  push:
    branches:
      - agent/fix-vessel-mechanics-tests

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find first failing Node test file
        shell: bash
        run: |
          set -u
          for f in tests/*.test.mjs; do
            echo "RUN $f"
            if ! node --test "$f" >/tmp/node-test.log 2>&1; then
              echo "FAILED_FILE=$f"
              echo "--- failure tail ---"
              tail -n 120 /tmp/node-test.log
              exit 1
            fi
          done
          echo "ALL_TEST_FILES_PASS"
