name: Diagnose Node tests

on:
  push:
    branches:
      - agent/fix-vessel-mechanics-tests
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show armored integration failures
        shell: bash
        run: |
          set +e
          node --test tests/free-roam-armored-client-integration.test.mjs >/tmp/node-test.log 2>&1
          rc=$?
          cat /tmp/node-test.log
          exit $rc
