name: Dock route diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run deterministic route diagnostic
        shell: bash
        run: |
          set -o pipefail
          node --test tests/tmp-dock-route-diagnostic.test.mjs 2>&1 | tee /tmp/dock-route-output.txt
      - name: Upload route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dock-route-diagnostic-output
          path: /tmp/dock-route-output.txt
          if-no-files-found: error
