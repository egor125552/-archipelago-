name: Test Echo Archipelago

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run tests
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          exit $code
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: error

  integrate-automatic-and-bomb-gesture:
    if: github.event_name == 'pull_request' && github.head_ref == 'shop-automatic-bomb-gesture'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply automatic purchase and iPhone bomb gesture
        shell: bash
        run: |
          python3 .github/integrate-automatic-bomb.py
          python3 .github/fix-automatic-bomb-tests.py
          node --check public/src/free-roam-shop-v8.js
          node --check public/src/free-roam-action-gestures.js
          node --check public/src/free-roam-v4.js
          node --check public/src/free-roam-activities.js
          node --check public/src/free-roam-core-v6.js
      - run: npm ci
      - name: Run complete project tests
        run: npm test
      - name: Publish verified implementation
        shell: bash
        run: |
          rm -f \
            .github/workflows/shop-automatic-bomb-gesture.yml \
            .github/shop-automatic-bomb-gesture-trigger \
            .github/integrate-automatic-bomb.py \
            .github/fix-automatic-bomb-tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sell missing automatics and add iPhone bomb gesture"
          git push origin HEAD:${{ github.head_ref }}
