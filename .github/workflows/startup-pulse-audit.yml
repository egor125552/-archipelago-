name: Startup pulse audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  startup-pulses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8796 > /tmp/startup-pulse-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8796/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/startup-pulse-worker.log
          exit 1
      - name: Repeat immediate weapon and sonar commands
        shell: bash
        run: |
          cat > .startup-pulses.mjs <<'EOF'
          import {chromium} from 'playwright';

          const base = 'http://127.0.0.1:8796';
          const browser = await chromium.launch({headless: true});
          const failures = [];

          async function runCommand(command, key, expected, attempts = 15) {
            for (let attempt = 1; attempt <= attempts; attempt++) {
              const context = await browser.newContext({viewport: {width: 1280, height: 900}});
              const page = await context.newPage();
              try {
                await page.goto(`${base}/free-roam.html`);
                await page.locator('#hostButton').click();
                await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
                const before = await page.evaluate(() => ({
                  weapon: window.__freeRoam.getWorld()?.players?.[0]?.combat?.equipped,
                  target: window.__freeRoam.getWorld()?.freeScenario?.targets?.[0] || null,
                  message: document.querySelector('#message')?.textContent?.trim(),
                  diagnostics: window.__freeRoam.networkDiagnostics(),
                }));
                await page.keyboard.press(key);
                let passed = true;
                try {
                  await page.waitForFunction(expected, null, {timeout: 3000});
                } catch (_) {
                  passed = false;
                }
                const after = await page.evaluate(() => ({
                  weapon: window.__freeRoam.getWorld()?.players?.[0]?.combat?.equipped,
                  target: window.__freeRoam.getWorld()?.freeScenario?.targets?.[0] || null,
                  message: document.querySelector('#message')?.textContent?.trim(),
                  diagnostics: window.__freeRoam.networkDiagnostics(),
                }));
                console.log(`${command} ${attempt} passed=${passed} before=${JSON.stringify(before)} after=${JSON.stringify(after)}`);
                if (!passed) failures.push(`${command} ${attempt}: command lost; before=${JSON.stringify(before)} after=${JSON.stringify(after)}`);
              } finally {
                await context.close();
              }
            }
          }

          await runCommand('WEAPON', 'KeyZ', () => window.__freeRoam.getWorld()?.players?.[0]?.combat?.equipped === 'pistol');
          await runCommand('SONAR', 'KeyQ', () => Boolean(window.__freeRoam.getWorld()?.freeScenario?.targets?.[0]));

          await browser.close();
          console.log(`STARTUP PULSE SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`STARTUP_PULSE_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.startup-pulses.mjs 2>&1 | tee /tmp/startup-pulse-output.txt
      - name: Upload startup pulse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-pulse-output
          path: |
            /tmp/startup-pulse-output.txt
            /tmp/startup-pulse-worker.log
          if-no-files-found: warn
