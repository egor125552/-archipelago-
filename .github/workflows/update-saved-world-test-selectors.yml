name: Update saved-world test selectors

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-saved-world-test-selectors.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace fragile button-text selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '.getByRole("button", {name: "Создать свободный мир"})'
          new = '.locator("#hostButton")'
          changed = []
          for path in Path("tests").glob("*.mjs"):
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          if not changed:
              raise SystemExit("No old selectors found")
          print("Updated:", *changed, sep="\n")
          PY
      - name: Commit selector updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Use stable host button selectors in browser tests"
          git push origin HEAD:main
