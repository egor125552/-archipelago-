name: Train tactical neural policy

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: Full URL of /api/training/archive?room=...
        required: false
        type: string
      epochs:
        description: Maximum training epochs
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: tactical-neural-policy
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRAINING_ARCHIVE_URL: ${{ inputs.archive_url || vars.TRAINING_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require a private server archive
        run: |
          if [ -z "$TRAINING_ARCHIVE_URL" ]; then
            echo "Provide archive_url or configure the TRAINING_ARCHIVE_URL repository variable."
            exit 2
          fi

      - name: Install CPU trainer and project dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Train, criticize and quantize a candidate
        run: |
          python -m py_compile training/*.py
          python training/train_policy.py \
            --url "$TRAINING_ARCHIVE_URL" \
            --epochs "${{ inputs.epochs || '100' }}" \
            --replay "$RUNNER_TEMP/tactical-replay.json" \
            --output training/reports/archive-candidate-policy.js \
            --report training/reports/latest.json
          python training/review_policy.py \
            --report training/reports/latest.json \
            --model training/reports/archive-candidate-policy.js \
            --output training/reports/latest-review.md

      - name: Verify candidate JavaScript inference and repository tests
        run: |
          cp src/generated/free-roam-tactical-policy-v1.js "$RUNNER_TEMP/base-policy.js"
          cp training/reports/archive-candidate-policy.js src/generated/free-roam-tactical-policy-v1.js
          npm test
          cp "$RUNNER_TEMP/base-policy.js" src/generated/free-roam-tactical-policy-v1.js

      - name: Upload candidate and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-policy-candidate-review
          path: |
            training/reports/latest.json
            training/reports/latest-review.md
            training/reports/archive-candidate-policy.js
          if-no-files-found: warn
          retention-days: 30

      - name: Require authoritative A/B before promotion
        run: |
          echo "Candidate produced successfully. It was not pushed to main."
          echo "Promotion requires held-out authoritative server A/B evidence and manual review."
