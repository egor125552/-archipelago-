name: Finalize sharp feedback

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'sharp-action-feedback-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sharp-action-feedback-20260725
      - name: Remove diagnostics and bump browser cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/free-roam.html')
          text = path.read_text(encoding='utf-8')
          old = 'src/free-roam-pistol-audio.js?v=4'
          new = 'src/free-roam-pistol-audio.js?v=5'
          if old not in text and new not in text:
              raise SystemExit('pistol audio script tag not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm -f \
            .github/workflows/sharp-feedback-audit.yml \
            tests/sharp-feedback-browser-audit.mjs \
            tests/sharp-feedback-jitter-proxy.mjs \
            .github/workflows/finalize-sharp-feedback.yml
      - name: Commit production-only branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/free-roam.html
          git commit -m "Finalize sharp action feedback for production"
          git push origin HEAD:sharp-action-feedback-20260725
