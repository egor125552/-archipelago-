name: Free roam UI consistency audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8793 > /tmp/ui-consistency-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8793/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/ui-consistency-worker.log
          exit 1
      - name: Compare reachable state with spoken and visible labels
        shell: bash
        run: |
          cat > .ui-consistency.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless: true});
          const failures = [];
          const base = 'http://127.0.0.1:8793';

          for (let attempt = 1; attempt <= 3; attempt++) {
            const context = await browser.newContext({viewport: {width: 1280, height: 900}});
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            try {
              await page.goto(`${base}/free-roam.html`);
              await page.locator('#hostButton').click();
              await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
              await page.waitForFunction(() => Boolean(window.__freeRoam?.getWorld?.()?.players?.[0]?.combat));
              const result = await page.evaluate(() => {
                const world = window.__freeRoam.getWorld();
                const combat = world.players[0].combat;
                return {
                  equipped: combat.equipped,
                  pistolAmmo: combat.pistolAmmo,
                  ammo: combat.ammo,
                  inventory: combat.inventory,
                  weaponValue: document.querySelector('#weaponValue')?.textContent?.trim(),
                  weaponButton: document.querySelector('#weaponButton')?.textContent?.trim(),
                  attackButton: document.querySelector('#attackButton')?.textContent?.trim(),
                  status: window.__freeRoam.status(),
                };
              });
              console.log(`START ${attempt} ${JSON.stringify(result)}`);
              assert.equal(errors.length, 0, errors.join(' | '));

              const expectedLabel = {
                fists: 'кулак',
                pistol: 'пистолет',
                knife: 'нож',
                automatic: 'автомат',
              }[result.equipped];
              const visibleText = `${result.weaponValue} ${result.weaponButton} ${result.attackButton} ${result.status}`.toLowerCase();
              if (expectedLabel && !visibleText.includes(expectedLabel)) {
                failures.push(`attempt ${attempt}: equipped=${result.equipped}, but interface/status=${JSON.stringify(result)}`);
              }

              await page.keyboard.press('KeyZ');
              await page.waitForTimeout(350);
              const afterCycle = await page.evaluate(() => ({
                equipped: window.__freeRoam.getWorld().players[0].combat.equipped,
                weaponValue: document.querySelector('#weaponValue')?.textContent?.trim(),
                weaponButton: document.querySelector('#weaponButton')?.textContent?.trim(),
                attackButton: document.querySelector('#attackButton')?.textContent?.trim(),
                status: window.__freeRoam.status(),
              }));
              console.log(`CYCLE ${attempt} ${JSON.stringify(afterCycle)}`);
            } finally {
              await context.close();
            }
          }

          await browser.close();
          console.log(`UI CONSISTENCY SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`UI_CONSISTENCY_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.ui-consistency.mjs 2>&1 | tee /tmp/ui-consistency-output.txt
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-roam-ui-consistency-output
          path: |
            /tmp/ui-consistency-output.txt
            /tmp/ui-consistency-worker.log
          if-no-files-found: warn
