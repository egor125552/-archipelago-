name: Input release audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8804 > /tmp/input-release-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8804/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/input-release-worker.log
          exit 1
      - name: Verify all emergency release paths
        shell: bash
        run: |
          cat > .input-release.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless: true});
          const failures = [];

          async function openGame() {
            const context = await browser.newContext({viewport: {width: 1280, height: 900}});
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:8804/free-roam.html');
            await page.locator('#hostButton').click();
            await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await page.waitForFunction(() => window.__freeRoam.networkDiagnostics().receivedStateCount >= 3, null, {timeout: 10000});
            return {context, page};
          }

          async function scenario(name, run) {
            const session = await openGame();
            try {
              await run(session.page);
              console.log(`${name} PASS`);
            } catch (error) {
              const state = await session.page.evaluate(() => ({
                input: {...window.__freeRoam.input},
                boat: {...window.__freeRoam.getWorld().boats[0]},
                combat: {...window.__freeRoam.getWorld().players[0].combat},
                targeting: window.__freeRoam.targeting(),
                message: document.querySelector('#message')?.textContent?.trim(),
              })).catch(() => null);
              failures.push(`${name}: ${error.stack || error}; state=${JSON.stringify(state)}`);
              console.error(`${name} FAIL ${error.stack || error} STATE ${JSON.stringify(state)}`);
            } finally {
              await session.context.close();
            }
          }

          await scenario('BLUR_RELEASES_THROTTLE', async page => {
            await page.keyboard.down('ArrowUp');
            await page.waitForTimeout(1200);
            const moving = await page.evaluate(() => ({speed: window.__freeRoam.getWorld().boats[0].speed, up: window.__freeRoam.input.up}));
            assert.equal(moving.up, true);
            assert.ok(moving.speed > 0.5);
            await page.evaluate(() => window.dispatchEvent(new Event('blur')));
            await page.waitForTimeout(900);
            const released = await page.evaluate(() => ({speed: window.__freeRoam.getWorld().boats[0].speed, throttle: window.__freeRoam.getWorld().boats[0].throttle, up: window.__freeRoam.input.up}));
            await page.keyboard.up('ArrowUp');
            console.log(`BLUR throttle ${JSON.stringify(moving)} -> ${JSON.stringify(released)}`);
            assert.equal(released.up, false);
            assert.equal(released.throttle, 0);
            assert.ok(released.speed <= moving.speed + 0.6, 'boat kept accelerating after blur');
          });

          await scenario('TARGET_MENU_RELEASES_MOVEMENT', async page => {
            await page.keyboard.down('ArrowUp');
            await page.waitForTimeout(700);
            await page.keyboard.press('KeyM');
            await page.waitForFunction(() => window.__freeRoam.targeting().open === true, null, {timeout: 2000});
            await page.waitForTimeout(500);
            const state = await page.evaluate(() => ({up: window.__freeRoam.input.up, throttle: window.__freeRoam.getWorld().boats[0].throttle}));
            await page.keyboard.up('ArrowUp');
            console.log(`MENU RELEASE ${JSON.stringify(state)}`);
            assert.equal(state.up, false);
            assert.equal(state.throttle, 0);
          });

          await scenario('BLUR_RELEASES_HELD_FIRE', async page => {
            await page.keyboard.press('KeyZ');
            await page.waitForFunction(() => window.__freeRoam.getWorld().players[0].combat.equipped === 'pistol', null, {timeout: 2500});
            await page.keyboard.down('KeyX');
            await page.waitForTimeout(900);
            const beforeBlur = await page.evaluate(() => ({ammo: window.__freeRoam.getWorld().players[0].combat.pistolAmmo, attack: window.__freeRoam.input.attack}));
            assert.equal(beforeBlur.attack, true);
            await page.evaluate(() => window.dispatchEvent(new Event('blur')));
            await page.waitForTimeout(300);
            const releasedAmmo = await page.evaluate(() => window.__freeRoam.getWorld().players[0].combat.pistolAmmo);
            await page.waitForTimeout(1200);
            const afterWait = await page.evaluate(() => ({ammo: window.__freeRoam.getWorld().players[0].combat.pistolAmmo, attack: window.__freeRoam.input.attack}));
            await page.keyboard.up('KeyX');
            console.log(`FIRE RELEASE ${JSON.stringify(beforeBlur)} releasedAmmo=${releasedAmmo} after=${JSON.stringify(afterWait)}`);
            assert.equal(afterWait.attack, false);
            assert.ok(afterWait.ammo >= releasedAmmo - 1, 'held fire continued after blur');
          });

          await browser.close();
          console.log(`INPUT RELEASE SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`INPUT_RELEASE_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.input-release.mjs 2>&1 | tee /tmp/input-release-output.txt
      - name: Upload input release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-release-output
          path: |
            /tmp/input-release-output.txt
            /tmp/input-release-worker.log
          if-no-files-found: warn
