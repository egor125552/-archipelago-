name: Startup input audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  startup-input:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8794 > /tmp/startup-input-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8794/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/startup-input-worker.log
          exit 1
      - name: Repeat first weapon command
        shell: bash
        run: |
          cat > .startup-input.mjs <<'EOF'
          import {chromium} from 'playwright';

          const browser = await chromium.launch({headless: true});
          const base = 'http://127.0.0.1:8794';
          const failures = [];

          async function attempt(kind, index, settle) {
            const context = await browser.newContext({viewport: {width: 1280, height: 900}});
            const page = await context.newPage();
            try {
              await page.goto(`${base}/free-roam.html`);
              await page.locator('#hostButton').click();
              await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
              if (settle) {
                await page.waitForFunction(() => window.__freeRoam?.networkDiagnostics?.().receivedStateCount >= 3, null, {timeout: 10000});
                await page.waitForTimeout(300);
              }
              const before = await page.evaluate(() => ({
                weapon: window.__freeRoam.getWorld().players[0].combat.equipped,
                diagnostics: window.__freeRoam.networkDiagnostics(),
              }));
              await page.keyboard.press('KeyZ');
              let switched = true;
              try {
                await page.waitForFunction(() => window.__freeRoam.getWorld().players[0].combat.equipped === 'pistol', null, {timeout: 2500});
              } catch (_) {
                switched = false;
              }
              const after = await page.evaluate(() => ({
                weapon: window.__freeRoam.getWorld().players[0].combat.equipped,
                button: document.querySelector('#weaponButton')?.textContent?.trim(),
                diagnostics: window.__freeRoam.networkDiagnostics(),
              }));
              console.log(`${kind} ${index} switched=${switched} before=${JSON.stringify(before)} after=${JSON.stringify(after)}`);
              if (!switched) failures.push(`${kind} ${index}: first Z command was lost; before=${JSON.stringify(before)} after=${JSON.stringify(after)}`);
            } finally {
              await context.close();
            }
          }

          for (let index = 1; index <= 10; index++) await attempt('IMMEDIATE', index, false);
          for (let index = 1; index <= 10; index++) await attempt('SETTLED', index, true);

          await browser.close();
          console.log(`STARTUP INPUT SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`STARTUP_INPUT_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.startup-input.mjs 2>&1 | tee /tmp/startup-input-output.txt
      - name: Upload startup input diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-input-output
          path: |
            /tmp/startup-input-output.txt
            /tmp/startup-input-worker.log
          if-no-files-found: warn
