name: Integrate Elite Boss V14 Fixes V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elite-boss-v14-integrate-fixes-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch authoritative implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def sub_one(text, pattern, replacement, label):
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 replacement, got {count}")
              return result

          path = Path("public/src/free-roam-elite-boat.js")
          source = path.read_text()

          armor = textwrap.dedent('''
          function normalizeArmorLayers(value) {
            const fallbacks = armorLayers();
            const valid = Array.isArray(value) && value.length === fallbacks.length
              && value.every((layer, index) => layer && typeof layer === "object" && layer.id === fallbacks[index].id);
            if (valid) {
              for (let index = 0; index < fallbacks.length; index += 1) {
                const current = value[index], fallback = fallbacks[index];
                current.id = fallback.id;
                current.maxHp = Math.max(1, finite(current.maxHp, fallback.maxHp));
                current.hp = clamp(current.hp ?? fallback.hp, 0, current.maxHp);
                current.state = String(current.state || fallback.state);
                current.criticalAnnounced = current.criticalAnnounced === true;
                current.destroyedAnnounced = current.destroyedAnnounced === true;
              }
              return value;
            }
            const existing = values(value);
            return fallbacks.map(fallback => {
              const current = existing.find(layer => layer?.id === fallback.id);
              if (!current) return fallback;
              return {...fallback, ...current, id: fallback.id, hp: clamp(current.hp ?? fallback.hp, 0, current.maxHp ?? fallback.maxHp), maxHp: Math.max(1, finite(current.maxHp, fallback.maxHp))};
            });
          }

          function normalizeTurrets''').strip()
          source = sub_one(source, r'function normalizeArmorLayers\(value\) \{.*?\n\}\n\nfunction normalizeTurrets', armor, "armor identity")

          turrets = textwrap.dedent('''
          function normalizeTurrets(value) {
            const fallbacks = [createTurret("port", "port"), createTurret("starboard", "starboard")];
            const valid = Array.isArray(value) && value.length === fallbacks.length
              && value.every((turret, index) => turret && typeof turret === "object" && (turret.id === fallbacks[index].id || turret.side === fallbacks[index].side));
            if (valid) {
              for (let index = 0; index < fallbacks.length; index += 1) {
                const current = value[index], fallback = fallbacks[index];
                current.id = fallback.id;
                current.side = fallback.side;
                current.maxHp = Math.max(1, finite(current.maxHp, fallback.maxHp));
                current.hp = clamp(current.hp ?? fallback.hp, 0, current.maxHp);
                current.destroyed = current.destroyed === true || current.hp <= 0;
                if (!current.state) current.state = fallback.state;
                if (!Number.isFinite(Number(current.fireCooldown))) current.fireCooldown = fallback.fireCooldown;
                if (!Number.isFinite(Number(current.shotCooldown))) current.shotCooldown = fallback.shotCooldown;
                if (!Number.isFinite(Number(current.windup))) current.windup = fallback.windup;
                if (!Number.isFinite(Number(current.burstRemaining))) current.burstRemaining = fallback.burstRemaining;
                if (!current.tacticalRole) current.tacticalRole = fallback.tacticalRole;
              }
              return value;
            }
            const existing = values(value);
            return fallbacks.map(fallback => {
              const current = existing.find(turret => turret?.id === fallback.id || turret?.side === fallback.side);
              if (!current) return fallback;
              return {...fallback, ...current, id: fallback.id, side: fallback.side, hp: clamp(current.hp ?? fallback.hp, 0, current.maxHp ?? fallback.maxHp), maxHp: Math.max(1, finite(current.maxHp, fallback.maxHp)), destroyed: current.destroyed === true || Number(current.hp) <= 0};
            });
          }

          function normalizeBombBay''').strip()
          source = sub_one(source, r'function normalizeTurrets\(value\) \{.*?\n\}\n\nfunction normalizeBombBay', turrets, "turret identity")

          tactical = textwrap.dedent('''
          function normalizeTacticalState(value, playerCount) {
            const fallback = createTacticalState(playerCount);
            const current = value && typeof value === "object" ? value : fallback;
            for (const [key, child] of Object.entries(fallback)) {
              if (!Object.hasOwn(current, key)) current[key] = Array.isArray(child) ? [...child] : child && typeof child === "object" ? {...child} : child;
            }
            if (!Array.isArray(current.playerMemory)) current.playerMemory = [];
            while (current.playerMemory.length < playerCount) current.playerMemory.push(createPlayerMemory());
            if (current.playerMemory.length > playerCount) current.playerMemory.length = playerCount;
            for (let index = 0; index < current.playerMemory.length; index += 1) {
              const memory = current.playerMemory[index] && typeof current.playerMemory[index] === "object"
                ? current.playerMemory[index]
                : (current.playerMemory[index] = createPlayerMemory());
              for (const [key, child] of Object.entries(createPlayerMemory())) if (!Object.hasOwn(memory, key)) memory[key] = child;
            }
            if (!current.teamMemory || typeof current.teamMemory !== "object") current.teamMemory = {...fallback.teamMemory};
            else for (const [key, child] of Object.entries(fallback.teamMemory)) if (!Object.hasOwn(current.teamMemory, key)) current.teamMemory[key] = child;
            if (!Array.isArray(current.tacticHistory)) current.tacticHistory = [];
            if (!current.tacticScores || typeof current.tacticScores !== "object") current.tacticScores = {};
            if (!Array.isArray(current.salvoPlan)) current.salvoPlan = [];
            if (!current.lastTurretHp || typeof current.lastTurretHp !== "object") current.lastTurretHp = {};
            if (!current.currentDecision || typeof current.currentDecision !== "object") current.currentDecision = {state: "observe", point: null, speed: 0};
            return current;
          }

          function defaultState''').strip()
          source = sub_one(source, r'function normalizeTacticalState\(value, playerCount\) \{.*?\n\}\n\nfunction defaultState', tactical, "tactical identity")

          source, count = re.subn(
              r'(function createTacticalState\(playerCount = 2\) \{\n  return \{[^\n]*lastBoundaryHeading: null)(\};)',
              r'\1, currentDecision: {state: "observe", point: null, speed: 0}\2',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"currentDecision default: got {count}")

          source = source.replace(
              'function resolveBombBayDetonation(world, state, sourcePlayer, damage) {',
              'function resolveBombBayDetonation(world, state, sourcePlayer, damage, exposedAtDestruction = false) {',
              1,
          )
          detonation_start = source.index('function resolveBombBayDetonation')
          detonation_end = source.index('\n}\n\nexport function damageEliteBoatBoss', detonation_start)
          detonation = source[detonation_start:detonation_end]
          detonation, count = re.subn(r'const exposed = \["opening", "open"\]\.includes\(state\.bombBayState\);', 'const exposed = Boolean(exposedAtDestruction);', detonation, count=1)
          if count != 1:
              raise SystemExit(f"detonation exposure: got {count}")
          source = source[:detonation_start] + detonation + source[detonation_end:]

          source, count = re.subn(
              r'bay\.destroyed = true; bay\.state = "destroyed"; state\.salvoRemaining = 0; state\.salvoCooldown = 0; state\.bombCooldown = Number\.POSITIVE_INFINITY; state\.bombRequests = \[\]; setBombBayState\(state, "destroyed"\);',
              'const exposedAtDestruction = exposed;\n      bay.destroyed = true; bay.state = "destroyed"; state.salvoRemaining = 0; state.salvoCooldown = 0; state.bombCooldown = 0; state.bombRequests = []; setBombBayState(state, "destroyed");',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"bomb bay destruction: got {count}")
          source = source.replace(
              'resolveBombBayDetonation(world, state, sourcePlayer, raw);',
              'resolveBombBayDetonation(world, state, sourcePlayer, raw, exposedAtDestruction);',
              1,
          )

          one_turret = textwrap.dedent('''
            if (systems.livingTurrets.length === 1 && systems.bombBayAlive) {
              const working = systems.livingTurrets[0];
              const workingSideTurn = working.side === "port" ? -54 : 54;
              if (metres < 72) {
                const away = bearing(primary.point, boat) + tactical.movementSide * 46, vector = headingVector(away);
                return {state: "single-turret-break-away", point: {x: clamp(boat.x + vector.x * 115, WORLD_BOUNDS.minX, WORLD_BOUNDS.maxX), y: clamp(boat.y + vector.y * 115, WORLD_BOUNDS.minY, WORLD_BOUNDS.maxY)}, speed: boat.maxSpeed};
              }
              const firingArc = bearing(boat, primary.point) + workingSideTurn, vector = headingVector(firingArc);
              return {state: "single-turret-cautious-fire", point: {x: clamp(boat.x + vector.x * 90, WORLD_BOUNDS.minX, WORLD_BOUNDS.maxX), y: clamp(boat.y + vector.y * 90, WORLD_BOUNDS.minY, WORLD_BOUNDS.maxY)}, speed: 19.5};
            }
          ''')
          marker = '  if (systems.disarmed) {'
          if source.count(marker) != 1:
              raise SystemExit(f"disarmed marker count={source.count(marker)}")
          source = source.replace(marker, one_turret + marker, 1)

          decision = textwrap.dedent('''
              state.tactical.decisionCooldown = Math.max(0, finite(state.tactical.decisionCooldown) - seconds);
              if (state.tactical.decisionCooldown <= 0 || !state.tactical.currentDecision?.point) {
                assignTurretTargets(world, state, players);
                state.tactical.currentDecision = chooseMovement(world, state, players);
                state.tactical.decisionCooldown = DECISION_INTERVAL_SECONDS;
              }
              applyMovement(world, state, state.tactical.currentDecision, seconds);
          ''').rstrip()
          source = sub_one(
              source,
              r'    state\.tactical\.decisionCooldown = Math\.max\(0, finite\(state\.tactical\.decisionCooldown\) - seconds\);\n    if \(state\.tactical\.decisionCooldown <= 0\) \{ assignTurretTargets\(world, state, players\); state\.tactical\.decisionCooldown = DECISION_INTERVAL_SECONDS; \}\n    const decision = chooseMovement\(world, state, players\);\n    applyMovement\(world, state, decision, seconds\);',
              decision,
              "decision cadence",
          )

          old_target = 'if (!state.bombBay.destroyed && ["opening", "open"].includes(state.bombBayState)) targets.push({id: state.bombBay.id, kind: "eliteBombBay", component: "bomb-bay", bombBayId: state.bombBay.id, point: boat, label: "элитный катер, открытый бомбоотсек", assigned: boat.targetPlayer === attackerIndex});'
          new_target = 'if (!state.bombBay.destroyed && ["opening", "open"].includes(state.bombBayState)) targets.push({id: state.bombBay.id, kind: "eliteTurret", component: "bomb-bay", turretId: state.bombBay.id, bombBayId: state.bombBay.id, point: {...boat, turrets: [...boat.turrets, state.bombBay]}, label: "элитный катер, открытый бомбоотсек", assigned: boat.targetPlayer === attackerIndex});'
          if source.count(old_target) != 1:
              raise SystemExit(f"bomb target count={source.count(old_target)}")
          source = source.replace(old_target, new_target, 1)
          path.write_text(source)

          bomb_path = Path("src/free-roam-mega-bomb-v37.js")
          bomb = bomb_path.read_text()
          bomb, count = re.subn(
              r'\.filter\(projectile => !before\.has\(String\(projectile\?\.id \|\| ""\)\) && Number\(projectile\?\.owner\) < 0\);',
              '.filter(projectile => !before.has(String(projectile?.id || "")));',
              bomb,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"fresh bomb filter: got {count}")
          bomb, count = re.subn(
              r'const request = launchable\[index\] \|\| launchable\.find\(candidate => \(\n      candidate\.sourceId === \(projectile\.sourceBoatId \|\| projectile\.sourceActorId\)\n    \)\);',
              'const request = launchable[index] || launchable.find(candidate => (\n      candidate.sourceId === (projectile.sourceBoatId || projectile.sourceActorId)\n    )) || pending[index] || pending[0] || null;',
              bomb,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"bomb request fallback: got {count}")
          bomb_path.write_text(bomb)

          test_path = Path("tests/free-roam-elite-boat-journal-v14.test.mjs")
          tests = test_path.read_text()
          presence = '  setPlayerPresence(world, 1, coop);\n'
          if tests.count(presence) != 1:
              raise SystemExit(f"test presence marker count={tests.count(presence)}")
          tests = tests.replace(presence, presence + '  world.freeThreatDirector ||= {graceUntil: [0, 0]};\n  world.freeThreatDirector.graceUntil = [0, 0];\n', 1)
          test_path.write_text(tests)
          PY
          node --check public/src/free-roam-elite-boat.js
          node --check src/free-roam-mega-bomb-v37.js
      - run: npm ci
      - name: Test and commit exact result
        shell: bash
        run: |
          set +e
          mkdir -p ci-results
          npm test > ci-results/elite-boss-v14-fixes-v2.txt 2>&1
          status=$?
          echo >> ci-results/elite-boss-v14-fixes-v2.txt
          echo "exit_code=${status}" >> ci-results/elite-boss-v14-fixes-v2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/src/free-roam-elite-boat.js src/free-roam-mega-bomb-v37.js tests/free-roam-elite-boat-journal-v14.test.mjs ci-results/elite-boss-v14-fixes-v2.txt
          git commit -m "fix: complete integrated elite boss state machine"
          git push
          exit ${status}
