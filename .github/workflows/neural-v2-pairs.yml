name: Neural v2 paired discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/free-roam-neural-v2-*.js"
      - "src/free-roam-server.js"
      - "training/generate_neural_v2_pairs.mjs"
      - "training/merge_neural_v2_pairs.mjs"
      - "tests/free-roam-neural-v2*.test.mjs"
      - ".github/workflows/neural-v2-pairs.yml"
  workflow_dispatch:
    inputs:
      campaign_target_pairs:
        description: Declared campaign target; this run proves only one indexed pair range
        required: true
        default: "1000000"
      start_index:
        description: First pair index in this batch
        required: true
        default: "0"
      batch_pairs:
        description: Identical-seed baseline/v2 pairs in this batch
        required: true
        default: "16384"
      shards:
        description: Parallel shards
        required: true
        default: "128"
      duration_ms:
        description: Maximum simulated duration per authoritative rollout
        required: true
        default: "60000"
      elite_per_group:
        description: Positive pairs retained per threat/script/mode/actor-role group and shard
        required: true
        default: "4"

permissions:
  contents: read

concurrency:
  group: neural-v2-pairs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      campaign_target_pairs: ${{ steps.plan.outputs.campaign_target_pairs }}
      start_index: ${{ steps.plan.outputs.start_index }}
      batch_pairs: ${{ steps.plan.outputs.batch_pairs }}
      shards: ${{ steps.plan.outputs.shards }}
      duration_ms: ${{ steps.plan.outputs.duration_ms }}
      elite_per_group: ${{ steps.plan.outputs.elite_per_group }}
    steps:
      - id: plan
        env:
          DISPATCH_TARGET: ${{ inputs.campaign_target_pairs }}
          DISPATCH_START: ${{ inputs.start_index }}
          DISPATCH_PAIRS: ${{ inputs.batch_pairs }}
          DISPATCH_SHARDS: ${{ inputs.shards }}
          DISPATCH_DURATION: ${{ inputs.duration_ms }}
          DISPATCH_ELITES: ${{ inputs.elite_per_group }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const manual = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
          const target = Math.max(1, Number(manual ? process.env.DISPATCH_TARGET : 256) || 256);
          const start = Math.max(0, Number(manual ? process.env.DISPATCH_START : 0) || 0);
          const pairs = Math.max(8, Number(manual ? process.env.DISPATCH_PAIRS : 256) || 256);
          const shards = Math.max(1, Math.min(128, Number(manual ? process.env.DISPATCH_SHARDS : 8) || 8));
          const duration = Math.max(8000, Number(manual ? process.env.DISPATCH_DURATION : 45000) || 45000);
          const elites = Math.max(1, Math.min(16, Number(manual ? process.env.DISPATCH_ELITES : 2) || 2));
          console.log(`matrix=${JSON.stringify({shard: Array.from({length: shards}, (_, index) => index)})}`);
          console.log(`campaign_target_pairs=${Math.floor(target)}`);
          console.log(`start_index=${Math.floor(start)}`);
          console.log(`batch_pairs=${Math.floor(pairs)}`);
          console.log(`shards=${Math.floor(shards)}`);
          console.log(`duration_ms=${Math.floor(duration)}`);
          console.log(`elite_per_group=${Math.floor(elites)}`);
          NODE

  discover:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run identical-seed authoritative v1 versus v2 pairs
        run: >-
          node training/generate_neural_v2_pairs.mjs
          --battles=${{ needs.plan.outputs.batch_pairs }}
          --start-index=${{ needs.plan.outputs.start_index }}
          --shard=${{ matrix.shard }}
          --shards=${{ needs.plan.outputs.shards }}
          --duration-ms=${{ needs.plan.outputs.duration_ms }}
          --minimum-advantage=2.5
          --elite-per-group=${{ needs.plan.outputs.elite_per_group }}
          --output=training/reports/v2-pairs/shard-${{ matrix.shard }}.json

      - name: Upload v2 pair shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-v2-pairs-shard-${{ matrix.shard }}
          path: training/reports/v2-pairs/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: always()
    needs:
      - plan
      - discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reject an incomplete discovery matrix
        if: needs.discover.result != 'success'
        run: |
          echo "At least one v2 pair shard failed. No aggregate may claim complete coverage."
          exit 2

      - name: Download all v2 pair shards
        uses: actions/download-artifact@v4
        with:
          pattern: neural-v2-pairs-shard-*
          path: training/reports/v2-pairs/input
          merge-multiple: true

      - name: Verify pair, rollout, feature and action integrity
        run: >-
          node training/merge_neural_v2_pairs.mjs
          --input=training/reports/v2-pairs/input
          --expected-pairs=${{ needs.plan.outputs.batch_pairs }}
          --expected-shards=${{ needs.plan.outputs.shards }}
          --expected-start-index=${{ needs.plan.outputs.start_index }}
          --output=training/reports/v2-pairs-aggregate.json

      - name: Write truthful campaign manifest
        run: |
          cat > training/reports/v2-pairs-campaign.json <<JSON
          {
            "campaignTargetPairs": ${{ needs.plan.outputs.campaign_target_pairs }},
            "batchStartPair": ${{ needs.plan.outputs.start_index }},
            "batchPairs": ${{ needs.plan.outputs.batch_pairs }},
            "batchEndPairExclusive": $(( ${{ needs.plan.outputs.start_index }} + ${{ needs.plan.outputs.batch_pairs }} )),
            "authoritativeRollouts": $(( ${{ needs.plan.outputs.batch_pairs }} * 2 )),
            "shards": ${{ needs.plan.outputs.shards }},
            "note": "This artifact proves one discovery range only. It does not train a v2 model and must not be presented as the completed campaign target."
          }
          JSON

      - name: Upload v2 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-v2-paired-discovery
          path: |
            training/reports/v2-pairs-aggregate.json
            training/reports/v2-pairs-campaign.json
          if-no-files-found: warn
          retention-days: 30
