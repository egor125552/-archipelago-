name: Apply local sonar cue

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve repair script and switch to main
        run: |
          cp .github/scripts/apply-local-sonar-cue.py /tmp/apply-local-sonar-cue.py
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python /tmp/apply-local-sonar-cue.py
      - run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Commit tested repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public tests
          git commit -m "Give keyboard sonar immediate local feedback"
          git push origin HEAD:main
