name: Mobile gesture dispatch audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gesture-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8800 > /tmp/mobile-dispatch-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8800/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/mobile-dispatch-worker.log
          exit 1
      - name: Test gesture handler with exact pointer groups
        shell: bash
        run: |
          cat > .mobile-dispatch.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless: true});
          const base = 'http://127.0.0.1:8800';
          const failures = [];
          const wrap = value => ((value + 180) % 360 + 360) % 360 - 180;

          async function openMobile() {
            const context = await browser.newContext({
              viewport: {width: 390, height: 844},
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1',
            });
            const page = await context.newPage();
            await page.goto(`${base}/free-roam.html`);
            await page.locator('#hostButton').click();
            await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await page.waitForFunction(() => window.__freeRoam.networkDiagnostics().receivedStateCount >= 3, null, {timeout: 10000});
            const surface = page.locator('#playSurface');
            return {context, page, surface};
          }

          async function pointer(surface, type, id, x, y, buttons) {
            await surface.dispatchEvent(type, {
              pointerId: id,
              pointerType: 'touch',
              isPrimary: id === 101,
              clientX: x,
              clientY: y,
              buttons,
              bubbles: true,
              cancelable: true,
            });
          }

          async function tap(surface, page, count, duration = 70) {
            const box = await surface.boundingBox();
            assert.ok(box, 'play surface has no bounds');
            const x = box.x + box.width / 2;
            const y = box.y + Math.min(box.height - 60, 430);
            for (let index = 0; index < count; index++) await pointer(surface, 'pointerdown', 101 + index, x + index * 12, y, 1);
            await page.waitForTimeout(duration);
            for (let index = 0; index < count; index++) await pointer(surface, 'pointerup', 101 + index, x + index * 12, y, 0);
          }

          async function swipe(surface, page, count, dx, dy) {
            const box = await surface.boundingBox();
            assert.ok(box, 'play surface has no bounds');
            const x = box.x + box.width / 2 - dx / 2;
            const y = box.y + Math.min(box.height - 60, 430) - dy / 2;
            for (let index = 0; index < count; index++) await pointer(surface, 'pointerdown', 101 + index, x + index * 12, y, 1);
            await page.waitForTimeout(70);
            for (let index = 0; index < count; index++) await pointer(surface, 'pointermove', 101 + index, x + dx + index * 12, y + dy, 1);
            await page.waitForTimeout(90);
            for (let index = 0; index < count; index++) await pointer(surface, 'pointerup', 101 + index, x + dx + index * 12, y + dy, 0);
          }

          async function scenario(name, run) {
            for (let attempt = 1; attempt <= 3; attempt++) {
              const mobile = await openMobile();
              try {
                await run(mobile);
                console.log(`${name} ${attempt} PASS`);
              } catch (error) {
                const state = await mobile.page.evaluate(() => ({
                  input: {...window.__freeRoam.input},
                  target: window.__freeRoam.getWorld()?.freeScenario?.targets?.[0],
                  beacon: window.__freeRoam.getWorld()?.freeScenario?.beaconUntil?.[0],
                  combat: window.__freeRoam.getWorld()?.players?.[0]?.combat,
                  targeting: window.__freeRoam.targeting(),
                  message: document.querySelector('#message')?.textContent?.trim(),
                })).catch(() => null);
                failures.push(`${name} ${attempt}: ${error.stack || error}; state=${JSON.stringify(state)}`);
                console.error(`${name} ${attempt} FAIL ${error.stack || error} STATE ${JSON.stringify(state)}`);
              } finally {
                await mobile.context.close();
              }
            }
          }

          await scenario('TWO_FINGER_SONAR', async ({page, surface}) => {
            await tap(surface, page, 2);
            await page.waitForFunction(() => window.__freeRoam.getWorld().freeScenario.beaconUntil[0] > 1_000_000, null, {timeout: 2500});
          });

          await scenario('TWO_FINGER_WEAPON', async ({page, surface}) => {
            await swipe(surface, page, 2, 150, 0);
            await page.waitForFunction(() => window.__freeRoam.getWorld().players[0].combat.equipped === 'pistol', null, {timeout: 2500});
          });

          await scenario('TWO_FINGER_PUMP', async ({page, surface}) => {
            await swipe(surface, page, 2, 0, -150);
            await page.waitForFunction(() => window.__freeRoam.input.pump === true, null, {timeout: 1500});
          });

          await scenario('FOUR_FINGER_GUIDE', async ({page, surface}) => {
            await page.keyboard.press('KeyQ');
            await page.waitForFunction(() => window.__freeRoam.getWorld().freeScenario.beaconUntil[0] > 1_000_000, null, {timeout: 2500});
            const before = await page.evaluate(() => {
              const world = window.__freeRoam.getWorld();
              const boat = world.boats[world.players[0].activeBoat];
              const target = world.freeScenario.targets[0];
              return {expected: Math.atan2(target.x - boat.x, -(target.y - boat.y)) * 180 / Math.PI};
            });
            await tap(surface, page, 4);
            await page.waitForTimeout(500);
            const heading = await page.evaluate(() => {
              const world = window.__freeRoam.getWorld();
              return world.boats[world.players[0].activeBoat].heading;
            });
            assert.ok(Math.abs(wrap(heading - before.expected)) <= 2, `heading ${heading}, expected ${before.expected}`);
          });

          await scenario('THREE_FINGER_DOUBLE_TARGETS', async ({page, surface}) => {
            await tap(surface, page, 3);
            await page.waitForTimeout(120);
            await tap(surface, page, 3);
            await page.waitForFunction(() => Boolean(window.__freeRoam.targeting()?.open), null, {timeout: 1800});
          });

          await scenario('THREE_FINGER_HOLD_ATTACK', async ({page, surface}) => {
            await page.keyboard.press('KeyZ');
            await page.waitForFunction(() => window.__freeRoam.getWorld().players[0].combat.equipped === 'pistol', null, {timeout: 2500});
            await tap(surface, page, 3, 650);
            let observed = false;
            for (let index = 0; index < 14; index++) {
              if (await page.evaluate(() => window.__freeRoam.input.attack === true)) observed = true;
              await page.waitForTimeout(50);
            }
            assert.equal(observed, true, 'held three-finger gesture never produced attack pulse');
          });

          await browser.close();
          console.log(`MOBILE HANDLER SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`MOBILE_HANDLER_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.mobile-dispatch.mjs 2>&1 | tee /tmp/mobile-dispatch-output.txt
      - name: Upload mobile dispatch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-gesture-dispatch-output
          path: |
            /tmp/mobile-dispatch-output.txt
            /tmp/mobile-dispatch-worker.log
          if-no-files-found: warn
