name: Publish elite boss release branch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild and verify release patches
        run: |
          cat .agent/elite-boss-release/part-* > /tmp/elite-boss-release.patch.gz.b64
          base64 --decode /tmp/elite-boss-release.patch.gz.b64 | gzip -d > /tmp/elite-boss-release.patch
          echo "1e3c32843159d5eab98ad2ff439725791f1f5ed7b06be7e3625ac753ef26f7a4  /tmp/elite-boss-release.patch" | sha256sum -c -
          cat .agent/elite-boss-new-files/part-* > /tmp/elite-boss-new-files.patch.gz.b64
          base64 --decode /tmp/elite-boss-new-files.patch.gz.b64 | gzip -d > /tmp/elite-boss-new-files.patch
          echo "72ec04421b9b40d66c05725771d533a8336fbeb8777317fe4ff158c9f32b110b  /tmp/elite-boss-new-files.patch" | sha256sum -c -
          cat .agent/elite-boss-e2e-fix/part-* > /tmp/elite-boss-e2e-fix.patch.gz.b64
          base64 --decode /tmp/elite-boss-e2e-fix.patch.gz.b64 | gzip -d > /tmp/elite-boss-e2e-fix.patch
          echo "5d6698303496d089d5b3bccbab57c176eb9cef2bedaa4da4b408d69df0c9e3ef  /tmp/elite-boss-e2e-fix.patch" | sha256sum -c -

      - name: Apply release over current main
        run: |
          git fetch origin main --depth=1
          git fetch origin agent/elite-boat-release-1.0:refs/remotes/origin/agent/elite-boat-release-1.0 || true
          git switch --force-create agent/elite-boat-release-1.0 origin/main
          git apply --index --check /tmp/elite-boss-release.patch
          git apply --index /tmp/elite-boss-release.patch
          git apply --index --check /tmp/elite-boss-new-files.patch
          git apply --index /tmp/elite-boss-new-files.patch
          git apply --index --check /tmp/elite-boss-e2e-fix.patch
          git apply --index /tmp/elite-boss-e2e-fix.patch
          git rm --cached --force .github/workflows/elite-boat-release.yml
          rm -f .github/workflows/elite-boat-release.yml
          git diff --cached --check
          test ! -e .agent
          test ! -e .github/workflows/agent-repo-snapshot.yml
          test -f public/src/free-roam-elite-boat.js
          test -f tests/free-roam-elite-boat-v1.test.mjs
          test -f tests/browser/elite-boat-browser.mjs

      - name: Install project dependencies
        run: npm ci

      - name: Check changed JavaScript modules
        run: |
          node --check public/src/free-roam-elite-boat.js
          node --check public/src/free-roam-hostile-actors.js
          node --check public/src/free-roam-threat-director.js
          node --check public/src/free-roam-threat-intelligence.js
          node --check public/src/free-roam-targeting.js
          node --check public/src/free-roam-combat.js
          node --check public/src/free-roam-combat-v2.js
          node --check public/src/free-roam-replication.js
          node --check public/src/free-roam-audio-v5.js
          node --check public/src/free-roam-core-v6.js
          node --check public/src/free-roam-mega-bomb-client-v25.js
          node --check src/free-roam-mega-bomb-v36.js
          node --check src/free-roam-server.js
          node --check tests/free-roam.e2e.spec.mjs
          node --check tests/free-roam-settings.e2e.spec.mjs

      - name: Run the complete deterministic test suite
        run: npm test

      - name: Install browser test runtimes
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.54.1
          npx playwright install --with-deps chromium webkit

      - name: Start the real public web root
        run: |
          python3 -m http.server 4173 --directory public > /tmp/archipelago-elite-browser-http.log 2>&1 &
          echo $! > /tmp/archipelago-elite-browser-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/elite-boat-browser-harness.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/archipelago-elite-browser-http.log
          exit 1

      - name: Run the full boss lifecycle in Chromium
        env:
          ARCHIPELAGO_TEST_URL: http://127.0.0.1:4173
        run: node tests/browser/elite-boat-browser.mjs

      - name: Run all two-client Chromium and iPhone WebKit scenarios
        shell: bash
        run: |
          npx wrangler dev --local --port 8787 --log-level error > /tmp/archipelago-elite-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error 'http://127.0.0.1:8787/api/rooms?mode=free' >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error 'http://127.0.0.1:8787/api/rooms?mode=free' >/dev/null
          CI=1 npx playwright test

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir=.worker-elite-dry-run

      - name: Create one release commit
        run: |
          git config user.name "Archipelago Release Agent"
          git config user.email "release-agent@users.noreply.github.com"
          git commit -m "Выпустить элитного катера-босса 1.0"
          git push --force-with-lease origin HEAD:refs/heads/agent/elite-boat-release-1.0

      - name: Show browser logs on failure
        if: failure()
        run: |
          cat /tmp/archipelago-elite-browser-http.log || true
          cat /tmp/archipelago-elite-worker.log || true
