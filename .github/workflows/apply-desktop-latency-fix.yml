name: Apply desktop latency fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preserve repair scripts and switch to main
        run: |
          cp .github/scripts/apply-desktop-latency-fix.py /tmp/apply-desktop-latency-fix.py
          cp .github/scripts/finish-desktop-latency-fix.py /tmp/finish-desktop-latency-fix.py
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply latency repair
        run: |
          python /tmp/apply-desktop-latency-fix.py
          python /tmp/finish-desktop-latency-fix.py
      - run: npm ci
      - name: Run Node tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test.log
      - name: Upload Node log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-latency-node-log
          path: node-test.log
          if-no-files-found: ignore
      - name: Commit tested latency repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public tests
          git commit -m "Smooth high-latency desktop movement and local feedback"
          git push origin HEAD:main
