name: Publish mega-bomb audio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-mega-bomb-audio.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified binary assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mega-bomb-audio public/audio
          curl --fail --location --retry 3 --output /tmp/mega-bomb-audio/mega-bomb-explosion-v12.mp3 \
            'https://drive.usercontent.google.com/download?id=1CLcnMmOwaWqEdmqKyWlFE324NV9CGjNP&export=download&confirm=t'
          curl --fail --location --retry 3 --output /tmp/mega-bomb-audio/mega-bomb-flight-continuous-v1.mp3 \
            'https://drive.usercontent.google.com/download?id=1LnaLECYBg815G79qhWUOifkSuB6Ak2Yu&export=download&confirm=t'
          echo 'b9abd69e210f5909cd0b55be87653f1658640f15b903160a99ad60011a1b9123  /tmp/mega-bomb-audio/mega-bomb-explosion-v12.mp3' | sha256sum --check --strict
          echo '4013c029faf080f699dc031c976c5b7754c454754f32ea6d1b4590630cbfdf1e  /tmp/mega-bomb-audio/mega-bomb-flight-continuous-v1.mp3' | sha256sum --check --strict
          test "$(stat -c%s /tmp/mega-bomb-audio/mega-bomb-explosion-v12.mp3)" = '248300'
          test "$(stat -c%s /tmp/mega-bomb-audio/mega-bomb-flight-continuous-v1.mp3)" = '337004'
          ffmpeg -v error -i /tmp/mega-bomb-audio/mega-bomb-explosion-v12.mp3 -f null -
          ffmpeg -v error -i /tmp/mega-bomb-audio/mega-bomb-flight-continuous-v1.mp3 -f null -
          mv /tmp/mega-bomb-audio/mega-bomb-explosion-v12.mp3 public/audio/
          mv /tmp/mega-bomb-audio/mega-bomb-flight-continuous-v1.mp3 public/audio/

      - name: Commit final binary files only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-audio-upload
          rm -f .github/workflows/publish-mega-bomb-audio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish final mega-bomb explosion and seamless flight audio'
          git push origin HEAD:main
