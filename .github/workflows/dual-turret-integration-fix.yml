name: Verify integrated dual-turret prototype

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: "${{ github.head_ref == 'agent/dual-turret-integration-fix' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin refs/heads/agent/dual-turret-integration-fix:refs/remotes/origin/agent/dual-turret-integration-fix
          git checkout -B agent/dual-turret-integration-fix refs/remotes/origin/agent/dual-turret-integration-fix
          node --version

      - name: Materialize reviewed integration fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import tarfile

          root = pathlib.Path.cwd().resolve()
          parts = sorted(root.glob('.github/dual-turret-fix-v2-*.txt'))
          if len(parts) != 4:
              raise SystemExit(f'expected 4 source parts, found {len(parts)}')

          encoded = ''.join(part.read_text().strip() for part in parts)
          archive = pathlib.Path('/tmp/dual-turret-fix-v2.tar.xz')
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = '1d938460f661c724509056f2444cfd3611f12e8d3baa9b534d45282f5bad651a'
          if digest != expected:
              raise SystemExit(f'archive SHA mismatch: {digest}')

          with tarfile.open(archive, 'r:xz') as source:
              for member in source.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'archive links are forbidden: {member.name}')
              source.extractall(root)
          PY

      - name: Update live client entry points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old!r}')
              file.write_text(text.replace(old, new))

          replace(
              'public/src/free-roam-v4.js',
              'from "./free-roam-core-v8.js?v=1";',
              'from "./free-roam-core-v8.js?v=2";',
          )
          replace(
              'public/src/free-roam-v4.js',
              'import {predictLocalWorld, reconcileLocalPrediction} from "./free-roam-client-prediction.js?v=41";',
              'import {predictLocalWorld, reconcileLocalPrediction} from "./free-roam-client-prediction.js?v=42";',
          )
          replace(
              'tests/free-roam-bomb-gesture-v1.test.mjs',
              'assert.match(client, /free-roam-core-v8\\.js\\?v=1/);',
              'assert.match(client, /free-roam-core-v8\\.js\\?v=2/);',
          )
          replace(
              'tests/free-roam-bomb-gesture-v1.test.mjs',
              'assert.match(html, /free-roam-v4\\.js\\?v=59/);',
              'assert.match(html, /free-roam-v4\\.js\\?v=60/);',
          )
          PY

      - name: Verify complete audio files
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum public/assets/audio/free-roam-dual-turret/dual-turret-shot-v1.mp3 | cut -d' ' -f1)" = "491a91efb10c8d9ee3d3d66d2a3a3b6fffbb31b1fbd9af53f7a578b2a4cf397a"
          test "$(sha256sum public/assets/audio/free-roam-dual-turret/dual-turret-engine-v1.mp3 | cut -d' ' -f1)" = "d9502b154ddfd08e51dbc1959dadd33259acf92547078e4a714cbdb278b19457"
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -v error -i public/assets/audio/free-roam-dual-turret/dual-turret-shot-v1.mp3 -f null -
            ffmpeg -v error -i public/assets/audio/free-roam-dual-turret/dual-turret-engine-v1.mp3 -f null -
          fi
          test -z "$(find public/assets/audio/free-roam-dual-turret -type f \( -name '*.part-*' -o -name '*.b64' -o -name 'chunk-*' -o -name '*.txt' \) -print -quit)"

      - name: Run focused dual-turret checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(
            find public/src src tests -type f \
              \( -name '*dual-turret*' -o -name 'free-roam-core-v8.js' -o -name 'free-roam-client-prediction.js' -o -name 'free-roam-server.js' -o -name 'free-roam-v4.js' \) \
              | sort
          )
          grep -q 'free-roam-core-v8.js?v=2' public/src/free-roam-v4.js
          grep -q 'free-roam-client-prediction.js?v=42' public/src/free-roam-v4.js
          grep -q 'free-roam-dual-turret-client.js?v=3' public/free-roam.html
          grep -q 'free-roam-v4.js?v=60' public/free-roam.html
          grep -q 'DUAL_TURRET_START_AMMO = 1000' public/src/free-roam-dual-turret-config.js
          grep -q 'DUAL_TURRET_TEST_RECOVERY_SECONDS = 60' public/src/free-roam-dual-turret-config.js
          grep -q 'stopLoop("motorboatReal")' public/src/free-roam-dual-turret-client.js
          node --test \
            tests/free-roam-dual-turret-v1.test.mjs \
            tests/free-roam-server-authority-v40.test.mjs \
            tests/free-roam-bomb-gesture-v1.test.mjs

      - name: Create clean verified commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/dual-turret-fix-v2-*.txt
          rm -f .github/workflows/dual-turret-integration-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrate dual-turret prototype with boat systems"
          git push origin HEAD:agent/dual-turret-integration-fix
