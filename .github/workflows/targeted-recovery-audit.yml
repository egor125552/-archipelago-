name: Targeted recovery audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start isolated Worker
        run: |
          npx wrangler dev --local --port 8789 > /tmp/recovery-wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8789/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/recovery-wrangler.log
          exit 1
      - name: Run targeted recovery scenarios
        shell: bash
        run: |
          cat > .targeted-recovery-audit.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:8789';
          const browser = await chromium.launch({headless: true});
          const failures = [];
          const number = text => Number(String(text || '').replace(',', '.').replace(/[^0-9.-]/g, ''));
          const partnerVisible = text => /^\d+\s*м$/.test(String(text || '').trim());

          async function openPair() {
            const hostContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const joinContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const host = await hostContext.newPage();
            const join = await joinContext.newPage();
            await Promise.all([host.goto(`${base}/free-roam.html`), join.goto(`${base}/free-roam.html`)]);
            await host.locator('#hostButton').click();
            await host.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await join.locator('#joinButton').click();
            await join.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await host.waitForFunction(() => /^\d+\s*м$/.test(document.querySelector('#otherValue')?.textContent?.trim() || ''), null, {timeout: 15000});
            await join.waitForFunction(() => /^\d+\s*м$/.test(document.querySelector('#otherValue')?.textContent?.trim() || ''), null, {timeout: 15000});
            return {hostContext, joinContext, host, join};
          }

          for (let attempt = 1; attempt <= 3; attempt++) {
            console.log(`REJOIN ${attempt} START`);
            const {hostContext, joinContext, host, join} = await openPair();
            try {
              const room = (await host.locator('#roomLabel').textContent() || '').trim();
              await join.locator('#leaveButton').click();
              await join.locator('#lobby').waitFor({state: 'visible', timeout: 5000});
              await host.waitForFunction(() => document.querySelector('#otherValue')?.textContent?.trim() === 'ждём', null, {timeout: 10000});
              await join.locator('#joinButton').click();
              let samePageJoined = true;
              try {
                await join.locator('#game').waitFor({state: 'visible', timeout: 15000});
              } catch (_) {
                samePageJoined = false;
              }
              const sameMessage = (await join.locator('#message').textContent() || '').trim();
              const roomSummary = (await join.locator('#roomsSummary').textContent() || '').trim();
              const hostPartner = (await host.locator('#otherValue').textContent() || '').trim();
              console.log(`REJOIN ${attempt} SAME_PAGE=${samePageJoined} message=${JSON.stringify(sameMessage)} rooms=${JSON.stringify(roomSummary)} hostPartner=${JSON.stringify(hostPartner)}`);
              if (!samePageJoined) {
                failures.push(`rejoin ${attempt}: same page stayed in lobby; message=${sameMessage}; rooms=${roomSummary}; host=${hostPartner}`);
                await joinContext.close();
                const freshContext = await browser.newContext({viewport: {width: 1280, height: 900}});
                const fresh = await freshContext.newPage();
                await fresh.goto(`${base}/free-roam.html`);
                await fresh.locator('#joinButton').click();
                let freshJoined = true;
                try {
                  await fresh.locator('#game').waitFor({state: 'visible', timeout: 15000});
                } catch (_) {
                  freshJoined = false;
                }
                console.log(`REJOIN ${attempt} FRESH_PAGE=${freshJoined} room=${room}`);
                await freshContext.close();
              }
            } finally {
              await hostContext.close();
              if (joinContext.pages().length) await joinContext.close();
            }
          }

          for (let attempt = 1; attempt <= 2; attempt++) {
            console.log(`OFFLINE ${attempt} START`);
            const {hostContext, joinContext, host, join} = await openPair();
            try {
              const roomBefore = (await join.locator('#roomLabel').textContent() || '').trim();
              const distanceBefore = number(await host.locator('#otherValue').textContent());
              await joinContext.setOffline(true);
              await join.waitForTimeout(3500);
              await joinContext.setOffline(false);
              let recovered = false;
              for (let second = 0; second <= 36; second += 3) {
                if (second) await join.waitForTimeout(3000);
                const state = {
                  second,
                  game: await join.locator('#game').isVisible(),
                  room: (await join.locator('#roomLabel').textContent() || '').trim(),
                  ownPartner: (await join.locator('#otherValue').textContent() || '').trim(),
                  hostPartner: (await host.locator('#otherValue').textContent() || '').trim(),
                  message: (await join.locator('#message').textContent() || '').trim(),
                  network: (await join.locator('#networkValue').textContent() || '').trim(),
                };
                console.log(`OFFLINE ${attempt} T+${second} ${JSON.stringify(state)}`);
                if (state.game && state.room === roomBefore && partnerVisible(state.ownPartner) && partnerVisible(state.hostPartner)) {
                  recovered = true;
                  break;
                }
              }
              if (recovered) {
                await join.keyboard.down('ArrowUp');
                await join.waitForTimeout(1200);
                await join.keyboard.up('ArrowUp');
                await join.waitForTimeout(800);
                const distanceAfter = number(await host.locator('#otherValue').textContent());
                console.log(`OFFLINE ${attempt} REPLICATION ${distanceBefore}->${distanceAfter}`);
                recovered = Math.abs(distanceAfter - distanceBefore) >= 1;
              }
              if (!recovered) failures.push(`offline ${attempt}: did not restore live replication in the same room`);
            } finally {
              await hostContext.close();
              await joinContext.close();
            }
          }

          for (let attempt = 1; attempt <= 3; attempt++) {
            console.log(`TOUCH_CANCEL ${attempt} START`);
            const context = await browser.newContext({
              viewport: {width: 390, height: 844},
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            try {
              await page.goto(`${base}/free-roam.html`);
              await page.locator('#hostButton').click();
              await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
              const box = await page.locator('#playSurface').boundingBox();
              assert.ok(box, 'play surface has no bounds');
              const client = await context.newCDPSession(page);
              const x = box.x + box.width / 2;
              const y = box.y + Math.min(box.height - 40, 430);
              await client.send('Input.dispatchTouchEvent', {type: 'touchStart', touchPoints: [{x, y, id: 1, radiusX: 4, radiusY: 4, force: 1}]});
              await client.send('Input.dispatchTouchEvent', {type: 'touchMove', touchPoints: [{x, y: y - 180, id: 1, radiusX: 4, radiusY: 4, force: 1}]});
              await page.waitForTimeout(1400);
              const moving = number(await page.locator('#speedValue').textContent());
              await client.send('Input.dispatchTouchEvent', {type: 'touchCancel', touchPoints: []});
              await page.waitForTimeout(1400);
              const after = number(await page.locator('#speedValue').textContent());
              console.log(`TOUCH_CANCEL ${attempt} speed=${moving}->${after} errors=${JSON.stringify(errors)}`);
              if (!(moving > 0.5 && after <= moving + 0.6 && errors.length === 0)) failures.push(`touch cancel ${attempt}: speed ${moving}->${after}; errors=${errors.join(' | ')}`);
            } finally {
              await context.close();
            }
          }

          await browser.close();
          console.log(`TARGETED SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`CONFIRMED_CANDIDATE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.targeted-recovery-audit.mjs 2>&1 | tee /tmp/targeted-recovery-output.txt
      - name: Upload targeted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-recovery-audit-output
          path: |
            /tmp/targeted-recovery-output.txt
            /tmp/recovery-wrangler.log
          if-no-files-found: warn
