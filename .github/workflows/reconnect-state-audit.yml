name: Reconnect state audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconnect-state:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8791 > /tmp/reconnect-state-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8791/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/reconnect-state-worker.log
          exit 1
      - name: Distinguish dead connection from stale warning
        shell: bash
        run: |
          cat > .reconnect-state.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:8791';
          const browser = await chromium.launch({headless: true});
          const failures = [];
          const numeric = text => Number(String(text || '').replace(',', '.').replace(/[^0-9.-]/g, ''));
          const partnerVisible = () => /^\d+\s*м$/.test(document.querySelector('#otherValue')?.textContent?.trim() || '');

          async function openPair() {
            const hostContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const joinContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const host = await hostContext.newPage();
            const join = await joinContext.newPage();
            await Promise.all([host.goto(`${base}/free-roam.html`), join.goto(`${base}/free-roam.html`)]);
            await host.locator('#hostButton').click();
            await host.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await join.locator('#joinButton').click();
            await join.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await host.waitForFunction(partnerVisible, null, {timeout: 15000});
            await join.waitForFunction(partnerVisible, null, {timeout: 15000});
            return {hostContext, joinContext, host, join};
          }

          for (let attempt = 1; attempt <= 3; attempt++) {
            console.log(`STATE ${attempt} START`);
            const {hostContext, joinContext, host, join} = await openPair();
            try {
              const roomBefore = await join.evaluate(() => window.__freeRoam.roomId());
              const before = await join.evaluate(() => window.__freeRoam.networkDiagnostics());
              await joinContext.setOffline(true);
              await join.waitForFunction(() => /переподключ|восстанавли|перестал присылать/i.test(document.querySelector('#message')?.textContent || ''), null, {timeout: 26000});
              const atWarning = await join.evaluate(() => ({
                message: document.querySelector('#message')?.textContent?.trim(),
                diagnostics: window.__freeRoam.networkDiagnostics(),
              }));
              console.log(`STATE ${attempt} WARNING ${JSON.stringify(atWarning)}`);
              await joinContext.setOffline(false);

              let liveStateReturned = false;
              let restoredText = false;
              let finalState = null;
              for (let elapsed = 0; elapsed <= 50; elapsed += 2) {
                if (elapsed) await join.waitForTimeout(2000);
                finalState = await join.evaluate(() => ({
                  message: document.querySelector('#message')?.textContent?.trim(),
                  room: window.__freeRoam.roomId(),
                  partner: document.querySelector('#otherValue')?.textContent?.trim(),
                  diagnostics: window.__freeRoam.networkDiagnostics(),
                }));
                if (elapsed % 10 === 0) console.log(`STATE ${attempt} T+${elapsed} ${JSON.stringify(finalState)}`);
                const diagnostics = finalState.diagnostics || {};
                liveStateReturned = Number(diagnostics.receivedStateCount) > Number(before.receivedStateCount) + 5
                  && Number(diagnostics.stateAgeMs) < 1500
                  && diagnostics.reconnecting === false
                  && finalState.room === roomBefore;
                restoredText = /Связь восстановлена/i.test(finalState.message || '');
                if (liveStateReturned && restoredText) break;
              }

              const distanceBefore = numeric(await host.locator('#otherValue').textContent());
              await join.keyboard.down('ArrowUp');
              await join.waitForTimeout(1500);
              await join.keyboard.up('ArrowUp');
              await join.waitForTimeout(1000);
              const joinSpeed = numeric(await join.locator('#speedValue').textContent());
              const distanceAfter = numeric(await host.locator('#otherValue').textContent());
              const replicationReturned = joinSpeed > 0.5 && Math.abs(distanceAfter - distanceBefore) >= 1;
              console.log(`STATE ${attempt} RESULT live=${liveStateReturned} text=${restoredText} replication=${replicationReturned} speed=${joinSpeed} distance=${distanceBefore}->${distanceAfter} final=${JSON.stringify(finalState)}`);

              if (!liveStateReturned || !replicationReturned) {
                failures.push(`attempt ${attempt}: connection did not recover; live=${liveStateReturned}; replication=${replicationReturned}; final=${JSON.stringify(finalState)}`);
              } else if (!restoredText) {
                failures.push(`attempt ${attempt}: connection recovered but warning stayed stale; final=${JSON.stringify(finalState)}`);
              }
            } finally {
              await hostContext.close();
              await joinContext.close();
            }
          }

          await browser.close();
          console.log(`RECONNECT STATE SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`RECONNECT_STATE_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.reconnect-state.mjs 2>&1 | tee /tmp/reconnect-state-output.txt
      - name: Upload reconnect state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconnect-state-output
          path: |
            /tmp/reconnect-state-output.txt
            /tmp/reconnect-state-worker.log
          if-no-files-found: warn
