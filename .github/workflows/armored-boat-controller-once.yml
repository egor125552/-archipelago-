name: Finalize armored boat controller

on:
  push:
    branches:
      - agent/armored-boat-controller

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/armored-boat-controller
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the integrated boat patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/armored_patch.py
          python3 /tmp/armored_patch.py
      - name: Check changed JavaScript syntax
        run: |
          node --check public/src/free-roam-player-boats.js
          node --check public/src/free-roam-dual-turret-boat.js
          node --check public/src/free-roam-dual-turret-audio.js
          node --check public/src/free-roam-dual-turret-client.js
          node --check public/src/free-roam-audio.js
          node --check public/src/audio-engine-v9.js
          node --check public/src/free-roam-client-prediction.js
          node --check public/src/free-roam-replication-v2.js
      - name: Verify the published armored engine exists
        run: test -s public/assets/audio/free-roam-dual-turret/dual-turret-engine-v1.mp3
      - name: Run only armored boat tests
        run: node --test tests/free-roam-dual-turret-v1.test.mjs
      - name: Commit the finished implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/armored-boat-controller-once.yml
          git add public tests
          git commit -m "fix: make armored patrol a profiled player boat [armored-final]"
          git push origin HEAD:agent/armored-boat-controller
