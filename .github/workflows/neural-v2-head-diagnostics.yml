name: Neural v2 expanded head diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/free-roam-neural-v2-*.js"
      - "src/free-roam-neural-control.js"
      - "src/free-roam-server.js"
      - "training/generate_neural_v2_head_pairs.mjs"
      - "training/diagnose_neural_v2_head_pairs.mjs"
      - "training/merge_neural_v2_head_diagnostics.mjs"
      - "tests/free-roam-neural-v2*.test.mjs"
      - ".github/workflows/neural-v2-head-diagnostics.yml"
  workflow_dispatch:
    inputs:
      start_index:
        description: First pair index in this diagnostic batch
        required: true
        default: "0"
      batch_pairs:
        description: Identical-seed baseline/single-head pairs
        required: true
        default: "4096"
      shards:
        description: Parallel shards
        required: true
        default: "32"
      duration_ms:
        description: Maximum simulated duration per rollout
        required: true
        default: "60000"

permissions:
  contents: read

concurrency:
  group: neural-v2-head-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      start_index: ${{ steps.plan.outputs.start_index }}
      batch_pairs: ${{ steps.plan.outputs.batch_pairs }}
      shards: ${{ steps.plan.outputs.shards }}
      duration_ms: ${{ steps.plan.outputs.duration_ms }}
    steps:
      - id: plan
        env:
          DISPATCH_START: ${{ inputs.start_index }}
          DISPATCH_PAIRS: ${{ inputs.batch_pairs }}
          DISPATCH_SHARDS: ${{ inputs.shards }}
          DISPATCH_DURATION: ${{ inputs.duration_ms }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const manual = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
          const start = Math.max(0, Number(manual ? process.env.DISPATCH_START : 0) || 0);
          const pairs = Math.max(20, Number(manual ? process.env.DISPATCH_PAIRS : 1024) || 1024);
          const shards = Math.max(1, Math.min(64, Number(manual ? process.env.DISPATCH_SHARDS : 16) || 16));
          const duration = Math.max(8000, Number(manual ? process.env.DISPATCH_DURATION : 45000) || 45000);
          console.log(`matrix=${JSON.stringify({shard: Array.from({length: shards}, (_, index) => index)})}`);
          console.log(`start_index=${Math.floor(start)}`);
          console.log(`batch_pairs=${Math.floor(pairs)}`);
          console.log(`shards=${Math.floor(shards)}`);
          console.log(`duration_ms=${Math.floor(duration)}`);
          NODE

  diagnose:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run expanded isolated-head diagnostics
        run: >-
          node training/diagnose_neural_v2_head_pairs.mjs
          --battles=${{ needs.plan.outputs.batch_pairs }}
          --start-index=${{ needs.plan.outputs.start_index }}
          --shard=${{ matrix.shard }}
          --shards=${{ needs.plan.outputs.shards }}
          --duration-ms=${{ needs.plan.outputs.duration_ms }}
          --output=training/reports/v2-head-diagnostics/shard-${{ matrix.shard }}.json

      - name: Upload diagnostic shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-v2-head-diagnostics-shard-${{ matrix.shard }}
          path: training/reports/v2-head-diagnostics/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: always()
    needs:
      - plan
      - diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reject incomplete diagnostics
        if: needs.diagnose.result != 'success'
        run: |
          echo "At least one expanded diagnostic shard failed."
          exit 2

      - name: Download diagnostic shards
        uses: actions/download-artifact@v4
        with:
          pattern: neural-v2-head-diagnostics-shard-*
          path: training/reports/v2-head-diagnostics/input
          merge-multiple: true

      - name: Verify and merge near-miss diagnostics
        run: >-
          node training/merge_neural_v2_head_diagnostics.mjs
          --input=training/reports/v2-head-diagnostics/input
          --expected-pairs=${{ needs.plan.outputs.batch_pairs }}
          --expected-shards=${{ needs.plan.outputs.shards }}
          --expected-start-index=${{ needs.plan.outputs.start_index }}
          --output=training/reports/v2-head-diagnostics-aggregate.json

      - name: Write diagnostic manifest
        run: |
          cat > training/reports/v2-head-diagnostics-manifest.json <<JSON
          {
            "batchStartPair": ${{ needs.plan.outputs.start_index }},
            "batchPairs": ${{ needs.plan.outputs.batch_pairs }},
            "batchEndPairExclusive": $(( ${{ needs.plan.outputs.start_index }} + ${{ needs.plan.outputs.batch_pairs }} )),
            "authoritativeRollouts": $(( ${{ needs.plan.outputs.batch_pairs }} * 2 )),
            "shards": ${{ needs.plan.outputs.shards }},
            "acceptanceThreshold": 2.5,
            "method": "one isolated action head over unchanged v1 per explored rollout",
            "trainingAllowed": false,
            "note": "Near misses are retained for diagnosis only. This workflow cannot produce training labels or enable a model."
          }
          JSON

      - name: Upload expanded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-v2-expanded-head-diagnostics
          path: |
            training/reports/v2-head-diagnostics-aggregate.json
            training/reports/v2-head-diagnostics-manifest.json
          if-no-files-found: warn
          retention-days: 30
