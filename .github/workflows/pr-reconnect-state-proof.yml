name: PR reconnect state proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconnect-state-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8791 > /tmp/reconnect-state-wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8791/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/reconnect-state-wrangler.log
          exit 1
      - name: Prove restored state and input
        shell: bash
        run: |
          cat > .reconnect-state-proof.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:8791';
          const browser = await chromium.launch({headless: true});
          const failures = [];
          const partnerVisible = () => /^\d+\s*м$/.test(document.querySelector('#otherValue')?.textContent?.trim() || '');

          async function openPair() {
            const hostContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const joinContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const host = await hostContext.newPage();
            const join = await joinContext.newPage();
            await Promise.all([host.goto(`${base}/free-roam.html`), join.goto(`${base}/free-roam.html`)]);
            await host.locator('#hostButton').click();
            await host.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await join.locator('#joinButton').click();
            await join.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await host.waitForFunction(partnerVisible, null, {timeout: 15000});
            await join.waitForFunction(partnerVisible, null, {timeout: 15000});
            return {hostContext, joinContext, host, join};
          }

          for (let attempt = 1; attempt <= 3; attempt++) {
            console.log(`STATE PROOF ${attempt} START`);
            const {hostContext, joinContext, host, join} = await openPair();
            try {
              const roomBefore = await join.evaluate(() => window.__freeRoam.roomId());
              const beforeDiagnostics = await join.evaluate(() => window.__freeRoam.networkDiagnostics());
              const beforeWorldTime = await host.evaluate(() => window.__freeRoam.getWorld().time);
              await joinContext.setOffline(true);
              await join.waitForFunction(() => window.__freeRoam.networkDiagnostics().reconnecting === true, null, {timeout: 24000});
              const offlineDiagnostics = await join.evaluate(() => window.__freeRoam.networkDiagnostics());
              const offlineMessage = (await join.locator('#message').textContent() || '').trim();
              await joinContext.setOffline(false);
              await join.waitForFunction(({count}) => {
                const diagnostics = window.__freeRoam.networkDiagnostics();
                return diagnostics.reconnecting === false && diagnostics.receivedStateCount > count;
              }, {count: beforeDiagnostics.receivedStateCount}, {timeout: 40000});
              await host.waitForFunction(() => window.__freeRoam.getWorld().freeActivities.presence[1] === true, null, {timeout: 15000});
              const afterDiagnostics = await join.evaluate(() => window.__freeRoam.networkDiagnostics());
              const roomAfter = await join.evaluate(() => window.__freeRoam.roomId());
              const afterWorldTime = await join.evaluate(() => window.__freeRoam.getWorld().time);
              const boatBefore = await host.evaluate(() => ({...window.__freeRoam.getWorld().boats[1]}));
              await join.keyboard.down('ArrowUp');
              await join.waitForTimeout(1500);
              await join.keyboard.up('ArrowUp');
              await join.waitForTimeout(900);
              const boatAfter = await host.evaluate(() => ({...window.__freeRoam.getWorld().boats[1]}));
              const finalMessage = (await join.locator('#message').textContent() || '').trim();
              console.log(`STATE PROOF ${attempt} room=${roomBefore}->${roomAfter} counts=${beforeDiagnostics.receivedStateCount}->${afterDiagnostics.receivedStateCount} reconnectAttempt=${offlineDiagnostics.reconnectAttempt}->${afterDiagnostics.reconnectAttempt} time=${beforeWorldTime}->${afterWorldTime} boatY=${boatBefore.y}->${boatAfter.y} offline=${JSON.stringify(offlineMessage)} final=${JSON.stringify(finalMessage)}`);
              assert.equal(roomAfter, roomBefore, 'reconnect changed room');
              assert.ok(afterWorldTime > beforeWorldTime, 'world state did not resume');
              assert.ok(boatAfter.y < boatBefore.y - 0.2, 'input after reconnect did not replicate');
            } catch (error) {
              failures.push(`attempt ${attempt}: ${error.stack || error}`);
              console.error(`STATE PROOF ${attempt} FAIL ${error.stack || error}`);
            } finally {
              await hostContext.close();
              await joinContext.close();
            }
          }

          await browser.close();
          console.log(`RECONNECT STATE SUMMARY failures=${failures.length}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.reconnect-state-proof.mjs 2>&1 | tee /tmp/reconnect-state-output.txt
      - name: Upload reconnect state proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconnect-state-proof-output
          path: |
            /tmp/reconnect-state-output.txt
            /tmp/reconnect-state-wrangler.log
          if-no-files-found: warn
