name: Rejoin timing audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rejoin-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8790 > /tmp/rejoin-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8790/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/rejoin-worker.log
          exit 1
      - name: Test rejoin timing boundaries
        shell: bash
        run: |
          cat > .rejoin-timing.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:8790';
          const browser = await chromium.launch({headless: true});
          const failures = [];

          async function openPair() {
            const hostContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const joinContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const host = await hostContext.newPage();
            const join = await joinContext.newPage();
            await Promise.all([host.goto(`${base}/free-roam.html`), join.goto(`${base}/free-roam.html`)]);
            await host.locator('#hostButton').click();
            await host.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await join.locator('#joinButton').click();
            await join.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await host.waitForFunction(() => /^\d+\s*м$/.test(document.querySelector('#otherValue')?.textContent?.trim() || ''), null, {timeout: 15000});
            return {hostContext, joinContext, host, join};
          }

          async function tryVariant(name, settleMs, explicitlyWaitForModule) {
            for (let attempt = 1; attempt <= 3; attempt++) {
              const {hostContext, joinContext, host, join} = await openPair();
              try {
                const navigation = join.waitForNavigation({waitUntil: 'domcontentloaded', timeout: 10000}).catch(() => null);
                await join.locator('#leaveButton').click();
                const navigationResult = await navigation;
                if (explicitlyWaitForModule) {
                  await join.waitForFunction(() => Boolean(window.__freeRoam) && !document.querySelector('#joinButton')?.disabled, null, {timeout: 10000});
                }
                if (settleMs) await join.waitForTimeout(settleMs);
                const stateBefore = await join.evaluate(() => ({
                  ready: document.readyState,
                  hasApi: Boolean(window.__freeRoam),
                  joinDisabled: document.querySelector('#joinButton')?.disabled,
                  hostDisabled: document.querySelector('#hostButton')?.disabled,
                  url: location.href,
                }));
                await join.locator('#joinButton').click();
                let joined = true;
                try { await join.locator('#game').waitFor({state: 'visible', timeout: 15000}); }
                catch (_) { joined = false; }
                const stateAfter = await join.evaluate(() => ({
                  message: document.querySelector('#message')?.textContent?.trim(),
                  rooms: document.querySelector('#roomsSummary')?.textContent?.trim(),
                  joinDisabled: document.querySelector('#joinButton')?.disabled,
                  hasApi: Boolean(window.__freeRoam),
                  network: window.__freeRoam?.networkDiagnostics?.(),
                  room: window.__freeRoam?.roomId?.(),
                }));
                console.log(`${name} ${attempt} navigation=${Boolean(navigationResult)} before=${JSON.stringify(stateBefore)} joined=${joined} after=${JSON.stringify(stateAfter)}`);
                if (!joined) failures.push(`${name} ${attempt}: failed after settle ${settleMs} ms; ${JSON.stringify(stateBefore)}; ${JSON.stringify(stateAfter)}`);
              } finally {
                await hostContext.close();
                await joinContext.close();
              }
            }
          }

          await tryVariant('DOM_ONLY', 0, false);
          await tryVariant('MODULE_READY', 0, true);
          await tryVariant('MODULE_PLUS_2000', 2000, true);
          await tryVariant('MODULE_PLUS_5000', 5000, true);

          await browser.close();
          console.log(`REJOIN TIMING SUMMARY failures=${failures.length}`);
          for (const failure of failures) console.error(`REJOIN_TIMING_FAILURE ${failure}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.rejoin-timing.mjs 2>&1 | tee /tmp/rejoin-timing-output.txt
      - name: Upload timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejoin-timing-output
          path: |
            /tmp/rejoin-timing-output.txt
            /tmp/rejoin-worker.log
          if-no-files-found: warn
