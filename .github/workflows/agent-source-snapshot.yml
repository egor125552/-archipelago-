name: Agent source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    if: "${{ github.head_ref == 'agent/boat-unification-source-snapshot' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload complete repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: archipelago-source-snapshot
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
