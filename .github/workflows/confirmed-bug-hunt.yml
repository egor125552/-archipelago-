name: Confirmed bug hunt

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repeat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repeat unit and regression tests three times
        run: |
          npm test
          npm test
          npm test

  chromium-real-player:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium driver
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start local Cloudflare Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/free-roam.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Play the same smoke scenario three times
        run: |
          cat > /tmp/bug-hunt.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const context = await browser.newContext({
              viewport: { width: 1280, height: 900 },
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            try {
              await page.goto('http://127.0.0.1:8787/free-roam.html', { waitUntil: 'domcontentloaded' });
              await page.locator('#hostButton').click();
              await page.locator('#game').waitFor({ state: 'visible', timeout: 15000 });
              await page.waitForFunction(() => {
                const text = document.querySelector('#networkValue')?.textContent || '';
                return text && !/измеряется|подключ/i.test(text);
              }, null, { timeout: 15000 }).catch(() => {});

              assert.equal(await page.locator('#game').isVisible(), true, 'game did not open');
              assert.equal(await page.locator('#lobby').isHidden(), true, 'lobby remained visible');

              const initialSpeed = Number((await page.locator('#speedValue').textContent())?.replace(',', '.') || 0);
              await page.keyboard.down('ArrowUp');
              await page.waitForTimeout(1400);
              await page.keyboard.up('ArrowUp');
              await page.waitForTimeout(250);
              const movingSpeed = Number((await page.locator('#speedValue').textContent())?.replace(',', '.') || 0);
              assert.ok(movingSpeed > initialSpeed, `held throttle did not increase speed: ${initialSpeed} -> ${movingSpeed}`);

              await page.keyboard.press('Space');
              await page.waitForTimeout(1200);
              const slowedSpeed = Number((await page.locator('#speedValue').textContent())?.replace(',', '.') || 0);
              assert.ok(slowedSpeed < movingSpeed, `floating brake did not reduce speed: ${movingSpeed} -> ${slowedSpeed}`);

              await page.keyboard.press('q');
              await page.waitForTimeout(300);
              const target = (await page.locator('#targetValue').textContent())?.trim() || '';
              const message = (await page.locator('#message').textContent())?.trim() || '';
              assert.ok(target !== 'не выбрана' || message.length > 0, 'sonar produced no target and no explanation');

              await page.locator('#leaveButton').click();
              await page.locator('#lobby').waitFor({ state: 'visible', timeout: 5000 });
              assert.equal(pageErrors.length, 0, `page errors: ${pageErrors.join(' | ')}`);
              assert.equal(consoleErrors.length, 0, `console errors: ${consoleErrors.join(' | ')}`);
            } catch (error) {
              failures.push(`attempt ${attempt}: ${error.stack || error}`);
            } finally {
              await context.close();
            }
          }

          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n\n'));
            process.exit(1);
          }
          EOF
          node /tmp/bug-hunt.mjs
      - name: Print Worker log on failure
        if: failure()
        run: cat /tmp/wrangler.log
