name: Verify Automatic Purchase And Bomb Gesture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate automatic purchase and iPhone bomb gesture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}: {old!r}, found {count}")
              path.write_text(text.replace(old, new, 1))

          shop_v8 = '''"use strict";

import * as base from "./free-roam-shop-v7.js";

export * from "./free-roam-shop-v7.js";

export const AUTOMATIC_WEAPON_PRICE = 120;
export const SHOP_ITEMS = base.SHOP_ITEMS;

function emit(world, type, text, targets = [0, 1], extra = {}) {
  world.events ||= [];
  world.events.push({type, text, targets, at: world.time, operationEvent: true, ...extra});
  if (world.events.length > 180) world.events.splice(0, world.events.length - 180);
}

function rising(input, previous, key) {
  return Boolean(input?.[key] && !previous?.[key]);
}

function lacksAutomatic(world, playerIndex) {
  return !world.players?.[playerIndex]?.combat?.weapons?.automatic;
}

function automaticDescription(world, playerIndex) {
  const state = base.ensureShopState(world);
  const ammo = Math.max(0, Math.floor(Number(world.players?.[playerIndex]?.combat?.ammo) || 0));
  return `Автомат. Цена ${AUTOMATIC_WEAPON_PRICE} кредитов. После покупки он сразу добавится тебе и будет выбран. Уже купленные патроны сохранятся: сейчас ${ammo}. Баланс команды ${state?.credits || 0}.`;
}

function patchShopEvents(world, startIndex = 0) {
  const events = world.events || [];
  for (let index = startIndex; index < events.length; index += 1) {
    const event = events[index];
    if (!event || event.itemId !== "automatic-ammo") continue;
    if (!["shop-open", "shop-selection"].includes(event.type)) continue;
    const playerIndex = Number.isInteger(event.sourcePlayer)
      ? event.sourcePlayer
      : Math.max(0, Number(event.targets?.[0]) || 0);
    if (!lacksAutomatic(world, playerIndex)) continue;
    const text = automaticDescription(world, playerIndex);
    event.text = event.type === "shop-open"
      ? `Магазин открыт. ${text} Листай товары, сервис и постоянные улучшения.`
      : text;
  }
}

export function handleMerchantAction(world, playerIndex) {
  const startIndex = world.events?.length || 0;
  const opened = base.handleMerchantAction(world, playerIndex);
  patchShopEvents(world, startIndex);
  return opened;
}

export function updateMerchantShop(world) {
  const state = base.ensureShopState(world);
  if (!state) return base.updateMerchantShop(world);
  const startIndex = world.events?.length || 0;
  const suppressed = [];

  for (let index = 0; index < (world.players || []).length; index += 1) {
    if (!state.shopOpen?.[index]) continue;
    const selected = base.SHOP_ITEMS[state.shopSelection?.[index] || 0];
    const input = state.inputs?.[index];
    const previous = state.previousInputs?.[index];
    if (selected?.id !== "automatic-ammo" || !rising(input, previous, "shopBuy")) continue;

    const combat = world.players?.[index]?.combat;
    if (!combat || !lacksAutomatic(world, index)) continue;

    if (state.credits < AUTOMATIC_WEAPON_PRICE) {
      emit(world, "shop-denied", `Недостаточно кредитов для автомата. Нужно ${AUTOMATIC_WEAPON_PRICE}, баланс команды ${state.credits}.`, [index], {
        sourcePlayer: index,
        itemId: "automatic-weapon",
      });
    } else {
      state.credits -= AUTOMATIC_WEAPON_PRICE;
      combat.weapons ||= {};
      combat.weapons.automatic = true;
      combat.equipped = "automatic";
      if (!Number.isFinite(Number(combat.ammo))) combat.ammo = 0;
      emit(world, "shop-purchased", `Куплен автомат. Он добавлен тебе и выбран. Патронов ${Math.max(0, Math.floor(Number(combat.ammo) || 0))}. Баланс команды ${state.credits}.`, [0, 1], {
        sourcePlayer: index,
        itemId: "automatic-weapon",
        price: AUTOMATIC_WEAPON_PRICE,
        credits: state.credits,
        x: base.MERCHANT.x,
        y: base.MERCHANT.y,
      });
    }

    if (input) {
      suppressed.push([input, input.shopBuy]);
      input.shopBuy = false;
    }
  }

  base.updateMerchantShop(world);
  for (const [input, value] of suppressed) input.shopBuy = value;
  patchShopEvents(world, startIndex);
}
'''
          Path("public/src/free-roam-shop-v8.js").write_text(shop_v8)
          replace_once(Path("public/src/free-roam-shop.js"), 'free-roam-shop-v7.js', 'free-roam-shop-v8.js')

          gestures = Path("public/src/free-roam-action-gestures.js")
          replace_once(
              gestures,
              '    // A downward two-finger swipe used to disable gesture mode entirely.\n    // It is intentionally unassigned now so an imprecise swipe cannot lock\n    // a touch player out of the gesture controls.\n    return null;',
              '    // A deliberate downward two-finger swipe launches the existing\n    // server-authoritative mega-bomb action.\n    return "mega-bomb";',
          )

          client = Path("public/src/free-roam-v4.js")
          replace_once(client, './free-roam-core-v6.js?v=46', './free-roam-core-v6.js?v=47')
          replace_once(client, './free-roam-action-gestures.js"', './free-roam-action-gestures.js?v=2"')
          replace_once(client, './free-roam-shop.js?v=3', './free-roam-shop.js?v=4')
          replace_once(client, '  guide: false,\n  targetId:', '  guide: false,\n  megaBomb: false,\n  targetId:')
          replace_once(
              client,
              'function selectedShopItem() {\n  const index = Number(world?.freeActivities?.shopSelection?.[playerIndex]) || 0;\n  return SHOP_ITEMS[((index % SHOP_ITEMS.length) + SHOP_ITEMS.length) % SHOP_ITEMS.length] || SHOP_ITEMS[0];\n}',
              'function selectedShopItem() {\n  const index = Number(world?.freeActivities?.shopSelection?.[playerIndex]) || 0;\n  const item = SHOP_ITEMS[((index % SHOP_ITEMS.length) + SHOP_ITEMS.length) % SHOP_ITEMS.length] || SHOP_ITEMS[0];\n  if (item?.id === "automatic-ammo" && !world?.players?.[playerIndex]?.combat?.weapons?.automatic) {\n    return {...item, label: "автомат"};\n  }\n  return item;\n}',
          )
          replace_once(client, '  localInput.guide = false;\n  localInput.shopPrevious', '  localInput.guide = false;\n  localInput.megaBomb = false;\n  localInput.shopPrevious')
          replace_once(client, '  else if (command === "guide") actionPulse("guide");\n  else if (command === "targets")', '  else if (command === "guide") actionPulse("guide");\n  else if (command === "mega-bomb") actionPulse("megaBomb");\n  else if (command === "targets")')

          activities = Path("public/src/free-roam-activities.js")
          replace_once(activities, './free-roam-shop.js?v=3', './free-roam-shop.js?v=4')

          core = Path("public/src/free-roam-core-v6.js")
          replace_once(core, './free-roam-activities.js?v=43', './free-roam-activities.js?v=44')
          replace_once(core, './free-roam-shop.js?v=3', './free-roam-shop.js?v=4')

          html = Path("public/free-roam.html")
          replace_once(html, 'взмах двумя вверх — насос; удержание двумя — пластину;', 'взмах двумя вверх — насос; взмах двумя вниз — запуск мега-бомбы; удержание двумя — пластину;')
          replace_once(html, 'взмах двумя вбок — переключить оружие; вверх — насос.', 'взмах двумя вбок — переключить оружие; вверх — насос; вниз — мега-бомба.')
          replace_once(html, 'src/free-roam-v4.js?v=57', 'src/free-roam-v4.js?v=58')

          shop_test = '''import test from "node:test";
import assert from "node:assert/strict";

import {
  AUTOMATIC_WEAPON_PRICE,
  MERCHANT,
  SHOP_ITEMS,
  handleMerchantAction,
  updateMerchantShop,
} from "../public/src/free-roam-shop-v8.js";

function makePlayer(automatic = false, ammo = 0) {
  return {
    mode: "foot",
    x: MERCHANT.x,
    y: MERCHANT.y,
    combat: {
      alive: true,
      weapons: {automatic},
      equipped: automatic ? "automatic" : "fists",
      ammo,
    },
  };
}

function makeWorld({credits = AUTOMATIC_WEAPON_PRICE, buyer = 1, automatic = false, ammo = 0} = {}) {
  const players = [makePlayer(true, 40), makePlayer(false, 0)];
  players[buyer] = makePlayer(automatic, ammo);
  const automaticIndex = SHOP_ITEMS.findIndex(item => item.id === "automatic-ammo");
  return {
    time: 12,
    players,
    boats: [],
    events: [],
    freeContracts: {scrap: 0},
    freeActivities: {
      credits,
      presence: [true, true],
      inputs: [{}, {}],
      previousInputs: [{}, {}],
      shopOpen: [false, false],
      shopSelection: [0, 0],
      merchantPrompted: [false, false],
      freeWreckRecoveryUsed: [false, false],
      automaticIndex,
    },
  };
}

function armPurchase(world, buyer) {
  const state = world.freeActivities;
  state.shopOpen[buyer] = true;
  state.shopSelection[buyer] = state.automaticIndex;
  state.inputs[buyer] = {shopBuy: true};
  state.previousInputs[buyer] = {shopBuy: false};
}

test("the automatic-ammo slot sells the missing player an automatic for 120 credits", () => {
  const world = makeWorld({buyer: 1, ammo: 47});
  armPurchase(world, 1);
  updateMerchantShop(world);

  assert.equal(world.players[1].combat.weapons.automatic, true);
  assert.equal(world.players[1].combat.equipped, "automatic");
  assert.equal(world.players[1].combat.ammo, 47);
  assert.equal(world.players[0].combat.ammo, 40);
  assert.equal(world.freeActivities.credits, 0);
  assert.equal(world.events.at(-1).itemId, "automatic-weapon");
  assert.equal(world.events.at(-1).sourcePlayer, 1);
});

test("the shop does not sell ammunition before the buyer owns the automatic", () => {
  const world = makeWorld({credits: AUTOMATIC_WEAPON_PRICE - 1, buyer: 0, automatic: false});
  armPurchase(world, 0);
  updateMerchantShop(world);

  assert.equal(world.players[0].combat.weapons.automatic, false);
  assert.equal(world.players[0].combat.ammo, 0);
  assert.equal(world.freeActivities.credits, AUTOMATIC_WEAPON_PRICE - 1);
  assert.equal(world.events.at(-1).type, "shop-denied");
  assert.equal(world.events.at(-1).itemId, "automatic-weapon");
});

test("after the weapon purchase the same slot returns to ordinary ammunition", () => {
  const world = makeWorld({credits: 25, buyer: 1, automatic: true, ammo: 10});
  armPurchase(world, 1);
  updateMerchantShop(world);

  assert.equal(world.players[1].combat.ammo, 40);
  assert.equal(world.freeActivities.credits, 0);
  assert.equal(world.events.at(-1).itemId, "automatic-ammo");
});

test("opening the selected slot announces the automatic when the player lacks it", () => {
  const world = makeWorld({buyer: 1});
  world.freeActivities.shopSelection[1] = world.freeActivities.automaticIndex;
  assert.equal(handleMerchantAction(world, 1), true);
  assert.match(world.events.at(-1).text, /Автомат\. Цена 120 кредитов/);
});
'''
          Path("tests/free-roam-shop-automatic-v8.test.mjs").write_text(shop_test)

          gesture_test = '''import test from "node:test";
import assert from "node:assert/strict";
import {readFile} from "node:fs/promises";

import {classifyActionGesture} from "../public/src/free-roam-action-gestures.js";

test("a deliberate two-finger downward swipe launches the mega-bomb command", () => {
  assert.equal(classifyActionGesture({pointers: 2, duration: 300, dx: 2, dy: 90, movement: 90}), "mega-bomb");
  assert.equal(classifyActionGesture({pointers: 2, duration: 300, dx: 2, dy: -90, movement: 90}), "pump");
  assert.equal(classifyActionGesture({pointers: 2, duration: 300, dx: 90, dy: 2, movement: 90}), "weapon");
});

test("the live iPhone gesture sends the existing server-authoritative megaBomb pulse", async () => {
  const [client, html, core, activities, shopEntry] = await Promise.all([
    readFile(new URL("../public/src/free-roam-v4.js", import.meta.url), "utf8"),
    readFile(new URL("../public/free-roam.html", import.meta.url), "utf8"),
    readFile(new URL("../public/src/free-roam-core-v6.js", import.meta.url), "utf8"),
    readFile(new URL("../public/src/free-roam-activities.js", import.meta.url), "utf8"),
    readFile(new URL("../public/src/free-roam-shop.js", import.meta.url), "utf8"),
  ]);

  assert.match(client, /megaBomb: false/);
  assert.match(client, /command === "mega-bomb"\) actionPulse\("megaBomb"\)/);
  assert.match(client, /localInput\.megaBomb = false/);
  assert.match(client, /free-roam-action-gestures\.js\?v=2/);
  assert.match(client, /free-roam-shop\.js\?v=4/);
  assert.match(client, /free-roam-core-v6\.js\?v=47/);
  assert.match(core, /free-roam-activities\.js\?v=44/);
  assert.match(core, /free-roam-shop\.js\?v=4/);
  assert.match(activities, /free-roam-shop\.js\?v=4/);
  assert.match(shopEntry, /free-roam-shop-v8\.js/);
  assert.match(html, /взмах двумя вниз — запуск мега-бомбы/);
  assert.match(html, /вниз — мега-бомба/);
  assert.match(html, /free-roam-v4\.js\?v=58/);
});
'''
          Path("tests/free-roam-bomb-gesture-v1.test.mjs").write_text(gesture_test)
          PY
          node --check public/src/free-roam-shop-v8.js
          node --check public/src/free-roam-action-gestures.js
          node --check public/src/free-roam-v4.js
          node --check public/src/free-roam-activities.js
          node --check public/src/free-roam-core-v6.js
      - run: npm ci
      - name: Run complete project tests
        run: npm test
      - name: Publish verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/shop-automatic-bomb-gesture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sell missing automatics and add iPhone bomb gesture"
          git push origin HEAD:${{ github.head_ref }}
