name: Temporary spatial assembly
on:
  push:
    branches:
      - tmp-spatial-proximity-20260817
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble verified files
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/spatial-part-* > public/src/spatial/spatial-free-roam-integration.js
          cat .tmp/test-part-* > tests/spatial-location-accessible-action.test.mjs
          test "$(git hash-object public/src/spatial/spatial-free-roam-integration.js)" = "eccd251822ffbea7424415b9cf112ece8834f94f"
          test "$(git hash-object tests/spatial-location-accessible-action.test.mjs)" = "1d5e19f879ce1d410028428890a67529da64f12a"
          node --check public/src/spatial/spatial-free-roam-integration.js
          node --check tests/spatial-location-accessible-action.test.mjs
          rm -rf .tmp
          rm .github/workflows/tmp-spatial-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/src/spatial/spatial-free-roam-integration.js tests/spatial-location-accessible-action.test.mjs .tmp .github/workflows/tmp-spatial-assemble.yml
          git commit -m "Assemble verified spatial proximity fix"
          git push origin HEAD:tmp-spatial-proximity-20260817
