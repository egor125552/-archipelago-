name: Vessel architecture gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vessel-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check vessel architecture syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check public/src/free-roam-core-v8.js
          node --check public/src/free-roam-target-menu.js
          node --check public/src/free-roam-scenario.js
          node --check public/src/free-roam-replication-v2.js
          node --check public/src/free-roam-dual-turret-audio.js
          node --check public/src/free-roam-dual-turret-client.js
          node --check public/src/free-roam-combat-v2.js
          node --check src/world-storage-normalization.js
          node --check src/worker-persistent.js
          while IFS= read -r file; do node --check "$file"; done < <(find public/src/vessel -type f -name '*.js' | sort)
          node --check tests/vessel-release-smoke.mjs
          node --check tests/vessel-architecture.test.mjs
          node --check tests/vessel-stress-test.test.mjs
          node --check tests/deck-speech-light-respawn-audio.test.mjs
          node --check tests/medium-crew-vessel.test.mjs
          node --check tests/vessel-authority.test.mjs
          node --check tests/vessel-authority-persistence.test.mjs
          node --check tests/vessel-extended-hull-combat.test.mjs

      - name: Run vessel runtime smoke
        run: timeout 20s node tests/vessel-release-smoke.mjs

      - name: Run vessel gameplay integrations
        run: timeout 90s node --test tests/vessel-stress-test.test.mjs tests/deck-speech-light-respawn-audio.test.mjs tests/medium-crew-vessel.test.mjs tests/vessel-authority.test.mjs tests/vessel-authority-persistence.test.mjs tests/vessel-extended-hull-combat.test.mjs

      - name: Run strict vessel architecture gate
        env:
          VESSEL_ARCH_STRICT_GIT: "1"
        run: timeout 90s node --test tests/vessel-architecture.test.mjs
