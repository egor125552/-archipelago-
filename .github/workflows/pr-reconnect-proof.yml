name: PR reconnect proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconnect-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8790 > /tmp/reconnect-wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8790/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/reconnect-wrangler.log
          exit 1
      - name: Prove reconnect and live replication
        shell: bash
        run: |
          cat > .reconnect-proof.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless: true});
          const base = 'http://127.0.0.1:8790';
          const failures = [];
          const number = text => Number(String(text || '').replace(',', '.').replace(/[^0-9.-]/g, ''));
          const partnerVisible = () => /^\d+\s*м$/.test(document.querySelector('#otherValue')?.textContent?.trim() || '');

          async function openPair() {
            const hostContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const joinContext = await browser.newContext({viewport: {width: 1280, height: 900}});
            const host = await hostContext.newPage();
            const join = await joinContext.newPage();
            await Promise.all([host.goto(`${base}/free-roam.html`), join.goto(`${base}/free-roam.html`)]);
            await host.locator('#hostButton').click();
            await host.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await join.locator('#joinButton').click();
            await join.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await host.waitForFunction(partnerVisible, null, {timeout: 15000});
            await join.waitForFunction(partnerVisible, null, {timeout: 15000});
            return {hostContext, joinContext, host, join};
          }

          for (let attempt = 1; attempt <= 3; attempt++) {
            console.log(`PROOF ${attempt} START`);
            const {hostContext, joinContext, host, join} = await openPair();
            try {
              const roomBefore = (await join.locator('#roomLabel').textContent() || '').trim();
              const distanceBefore = number(await host.locator('#otherValue').textContent());
              await joinContext.setOffline(true);
              await join.waitForFunction(() => /переподключ|восстанавли|перестал присылать/i.test(document.querySelector('#message')?.textContent || ''), null, {timeout: 24000});
              const disconnectMessage = (await join.locator('#message').textContent() || '').trim();
              const hostDuring = (await host.locator('#otherValue').textContent() || '').trim();
              console.log(`PROOF ${attempt} DISCONNECTED message=${JSON.stringify(disconnectMessage)} hostPartner=${JSON.stringify(hostDuring)}`);
              await joinContext.setOffline(false);
              await join.waitForFunction(() => /Связь восстановлена/i.test(document.querySelector('#message')?.textContent || ''), null, {timeout: 40000});
              await host.waitForFunction(partnerVisible, null, {timeout: 20000});
              await join.waitForFunction(partnerVisible, null, {timeout: 20000});
              const restoredMessage = (await join.locator('#message').textContent() || '').trim();
              const roomAfter = (await join.locator('#roomLabel').textContent() || '').trim();
              const distanceRestored = number(await host.locator('#otherValue').textContent());
              await join.keyboard.down('ArrowUp');
              await join.waitForTimeout(1500);
              await join.keyboard.up('ArrowUp');
              await join.waitForTimeout(900);
              const joinSpeed = number(await join.locator('#speedValue').textContent());
              const distanceAfterMove = number(await host.locator('#otherValue').textContent());
              console.log(`PROOF ${attempt} RESTORED room=${roomBefore}->${roomAfter} message=${JSON.stringify(restoredMessage)} speed=${joinSpeed} distance=${distanceBefore}/${distanceRestored}->${distanceAfterMove}`);
              assert.equal(roomAfter, roomBefore, 'reconnect entered another room');
              assert.ok(joinSpeed > 0.5, 'reconnected player input did not move its boat');
              assert.ok(Math.abs(distanceAfterMove - distanceRestored) >= 1, 'new movement did not replicate after reconnect');
            } catch (error) {
              failures.push(`attempt ${attempt}: ${error.stack || error}`);
              console.error(`PROOF ${attempt} FAIL ${error.stack || error}`);
            } finally {
              await hostContext.close();
              await joinContext.close();
            }
          }

          await browser.close();
          console.log(`RECONNECT PROOF SUMMARY failures=${failures.length}`);
          if (failures.length) process.exit(1);
          EOF
          set -o pipefail
          node ./.reconnect-proof.mjs 2>&1 | tee /tmp/reconnect-proof-output.txt
      - name: Upload reconnect proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconnect-proof-output
          path: |
            /tmp/reconnect-proof-output.txt
            /tmp/reconnect-wrangler.log
          if-no-files-found: warn
