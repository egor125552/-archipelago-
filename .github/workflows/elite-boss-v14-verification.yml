name: Elite Boss V14 Verification

on:
  push:
    branches: [main]
    paths:
      - "public/src/free-roam-quality-v1.js"
      - "public/src/free-roam-hostile-actors.js"
      - "public/src/free-roam-elite-boat.js"
      - "public/src/free-roam-elite-boat-audio-v11.js"
      - "public/src/free-roam-replication.js"
      - "src/free-roam-server.js"
      - "src/free-roam-hostile-respawn-grace.js"
      - "src/free-roam-mega-bomb.js"
      - "src/free-roam-mega-bomb-v37.js"
      - "tests/free-roam-elite-boat-journal-v14.test.mjs"
      - "tests/free-roam-hostile-respawn-grace.test.mjs"
      - "tests/free-roam-elite-audio-cache-v14.test.mjs"
      - ".github/workflows/elite-boss-v14-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
