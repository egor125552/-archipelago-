name: Free roam progression audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reachable-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.54.1
      - run: npx playwright install --with-deps chromium
      - name: Start Worker
        run: |
          npx wrangler dev --local --port 8797 > /tmp/progression-worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8797/free-roam.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/progression-worker.log
          exit 1
      - name: Play reachable delivery and arming route
        shell: bash
        run: |
          cat > .progression-route.mjs <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:8797';
          const browser = await chromium.launch({headless: true});
          const context = await browser.newContext({viewport: {width: 1280, height: 900}});
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          const distance = (a, b) => Math.hypot((a?.x || 0) - (b?.x || 0), (a?.y || 0) - (b?.y || 0));

          async function snapshot(label) {
            const state = await page.evaluate(() => {
              const world = window.__freeRoam.getWorld();
              const player = world.players[0];
              const boat = Number.isInteger(player.activeBoat) ? world.boats[player.activeBoat] : world.boats.find(item => item.owner === 0);
              return {
                time: world.time,
                phase: world.freeScenario?.phase,
                target: world.freeScenario?.targets?.[0] || null,
                player: {mode: player.mode, x: player.x, y: player.y, carried: player.combat?.carriedCrate, equipped: player.combat?.equipped, automatic: player.combat?.weapons?.automatic},
                boat: boat && {id: boat.id, x: boat.x, y: boat.y, heading: boat.heading, speed: boat.speed, cargo: [...(boat.cargo || [])]},
                delivered: [...(world.freeActivities?.delivered || [])],
                credits: world.freeActivities?.credits,
                message: document.querySelector('#message')?.textContent?.trim(),
                diagnostics: window.__freeRoam.networkDiagnostics(),
              };
            });
            console.log(`${label} ${JSON.stringify(state)}`);
            return state;
          }

          async function hold(key, ms) {
            await page.keyboard.down(key);
            await page.waitForTimeout(ms);
            await page.keyboard.up(key);
            await page.waitForTimeout(120);
          }

          async function pulse(key, settle = 300) {
            await page.keyboard.press(key);
            await page.waitForTimeout(settle);
          }

          async function moveBoatToTarget(maxSteps = 55, limit = 10.5) {
            for (let step = 0; step < maxSteps; step++) {
              const data = await page.evaluate(() => {
                const world = window.__freeRoam.getWorld();
                const player = world.players[0];
                const boat = world.boats[player.activeBoat];
                return {mode: player.mode, boat: boat && {x: boat.x, y: boat.y, speed: boat.speed}, target: world.freeScenario?.targets?.[0] || null};
              });
              assert.equal(data.mode, 'boat', `expected boat while navigating, got ${data.mode}`);
              assert.ok(data.target, 'navigation target disappeared');
              const metres = distance(data.boat, data.target);
              if (step % 5 === 0) console.log(`BOAT STEP ${step} target=${data.target.kind}:${data.target.id} distance=${metres.toFixed(1)} speed=${Number(data.boat.speed).toFixed(1)}`);
              if (metres <= limit) {
                await pulse('Space', 1300);
                return await snapshot('BOAT ARRIVED');
              }
              await pulse('KeyY', 170);
              await hold('ArrowUp', metres > 55 ? 950 : metres > 25 ? 700 : 420);
            }
            throw new Error('boat could not reach target within step limit');
          }

          async function moveFootToTarget(maxSteps = 70, limit = 3.1) {
            for (let step = 0; step < maxSteps; step++) {
              const data = await page.evaluate(() => {
                const world = window.__freeRoam.getWorld();
                const player = world.players[0];
                return {mode: player.mode, player: {x: player.x, y: player.y}, target: world.freeScenario?.targets?.[0] || null};
              });
              assert.ok(['foot', 'swim', 'roof'].includes(data.mode), `expected foot/swim navigation, got ${data.mode}`);
              assert.ok(data.target, 'foot navigation target disappeared');
              const metres = distance(data.player, data.target);
              if (step % 6 === 0) console.log(`FOOT STEP ${step} mode=${data.mode} target=${data.target.kind}:${data.target.id} distance=${metres.toFixed(1)}`);
              if (metres <= limit) return await snapshot('FOOT ARRIVED');
              const dx = data.target.x - data.player.x;
              const dy = data.target.y - data.player.y;
              const key = Math.abs(dx) > Math.abs(dy)
                ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft')
                : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
              await page.keyboard.down('Shift');
              await hold(key, metres > 25 ? 650 : 350);
              await page.keyboard.up('Shift');
            }
            throw new Error('player could not reach target on foot within step limit');
          }

          async function moveFootToPoint(point, maxSteps = 55, limit = 7) {
            for (let step = 0; step < maxSteps; step++) {
              const player = await page.evaluate(() => {
                const value = window.__freeRoam.getWorld().players[0];
                return {mode: value.mode, x: value.x, y: value.y};
              });
              const metres = distance(player, point);
              if (metres <= limit) return;
              const dx = point.x - player.x;
              const dy = point.y - player.y;
              const key = Math.abs(dx) > Math.abs(dy)
                ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft')
                : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
              await page.keyboard.down('Shift');
              await hold(key, metres > 20 ? 550 : 300);
              await page.keyboard.up('Shift');
            }
            throw new Error('player could not reach requested point');
          }

          try {
            await page.goto(`${base}/free-roam.html`);
            await page.locator('#hostButton').click();
            await page.locator('#game').waitFor({state: 'visible', timeout: 15000});
            await page.waitForFunction(() => window.__freeRoam.networkDiagnostics().receivedStateCount >= 3, null, {timeout: 10000});
            await snapshot('START');

            // First ordinary water crate: pump at the nearest reachable target.
            await pulse('KeyQ');
            let state = await snapshot('SONAR FIRST CRATE');
            assert.equal(state.target?.id, 'crate-pump', `expected nearest pump crate, got ${state.target?.id}`);
            await moveBoatToTarget();
            await pulse('KeyF', 700);
            state = await snapshot('FIRST CRATE STOWED');
            assert.ok(state.boat.cargo.includes('crate-pump'), 'pump crate was not loaded with F');

            // Deliver first boat cargo.
            await pulse('KeyQ');
            assert.equal((await snapshot('SONAR FIRST DOCK')).target?.kind, 'dock');
            await moveBoatToTarget(45, 8.5);
            await page.waitForFunction(() => window.__freeRoam.getWorld().freeActivities.delivered[0] >= 1, null, {timeout: 7000});
            state = await snapshot('FIRST DELIVERY');
            assert.equal(state.delivered[0], 1, 'first delivery did not count');

            // Second ordinary crate is on land: use landing, walk, pick up and carry to dock.
            await pulse('KeyQ');
            state = await snapshot('SONAR LANDING');
            assert.equal(state.target?.kind, 'landing', `expected a landing target, got ${state.target?.kind}`);
            await moveBoatToTarget(25, 12.5);
            await pulse('KeyF', 700);
            await page.waitForFunction(() => window.__freeRoam.getWorld().players[0].mode !== 'boat', null, {timeout: 5000});
            state = await snapshot('LEFT BOAT');
            await pulse('KeyQ');
            state = await snapshot('SONAR LAND CRATE');
            assert.ok(state.target?.id?.startsWith('crate-'), 'sonar did not switch from landing to land crate');
            await moveFootToTarget();
            await pulse('KeyF', 600);
            state = await snapshot('LAND CRATE PICKED');
            assert.ok(state.player.carried, 'land crate was not picked up');
            await pulse('KeyQ');
            state = await snapshot('SONAR FOOT DOCK');
            assert.equal(state.target?.kind, 'dock', 'carried land cargo did not retarget to dock');
            await moveFootToTarget(60, 4.5);
            await page.waitForFunction(() => window.__freeRoam.getWorld().freeActivities.delivered[0] >= 2, null, {timeout: 7000});
            state = await snapshot('SECOND DELIVERY');
            assert.equal(state.phase, 'arm', 'two reachable deliveries did not unlock arming phase');

            // Return to the actual boat and board it through F.
            const boatPoint = await page.evaluate(() => {
              const boat = window.__freeRoam.getWorld().boats.find(item => item.owner === 0);
              return {x: boat.x, y: boat.y};
            });
            await moveFootToPoint(boatPoint);
            await pulse('KeyF', 800);
            await page.waitForFunction(() => window.__freeRoam.getWorld().players[0].mode === 'boat', null, {timeout: 5000});
            await snapshot('BOARDED AGAIN');

            // Reach and deliver the unique automatic crate.
            await pulse('KeyQ');
            state = await snapshot('SONAR AUTOMATIC');
            assert.equal(state.target?.id, 'crate-automatic', `arming phase did not select automatic crate: ${state.target?.id}`);
            await moveBoatToTarget(80, 10.5);
            await pulse('KeyF', 800);
            state = await snapshot('AUTOMATIC STOWED');
            assert.ok(state.boat.cargo.includes('crate-automatic'), 'automatic crate was not loaded');
            assert.equal(state.player.automatic, true, 'loading automatic crate did not grant the weapon');
            await pulse('KeyQ');
            assert.equal((await snapshot('SONAR AUTOMATIC DOCK')).target?.kind, 'dock');
            await moveBoatToTarget(90, 8.5);
            await page.waitForFunction(() => window.__freeRoam.getWorld().freeScenario.phase !== 'arm', null, {timeout: 8000});
            state = await snapshot('AUTOMATIC DELIVERED');
            assert.ok(['warning', 'pursuit'].includes(state.phase), `automatic delivery did not advance scenario: ${state.phase}`);
            assert.equal(errors.length, 0, errors.join(' | '));
            console.log('PROGRESSION ROUTE PASS');
          } finally {
            await context.close();
            await browser.close();
          }
          EOF
          set -o pipefail
          node ./.progression-route.mjs 2>&1 | tee /tmp/progression-output.txt
      - name: Upload progression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-roam-progression-output
          path: |
            /tmp/progression-output.txt
            /tmp/progression-worker.log
          if-no-files-found: warn
