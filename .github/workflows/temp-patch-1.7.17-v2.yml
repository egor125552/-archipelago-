name: Temporary patch 1.7.17 v2

on:
  push:
    branches:
      - fix/stress-pistol-live-falloff-1.7.17

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrow 1.7.17 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          print('patch current vessel definition')
          current = Path('public/src/vessel/definitions/current-vessels.js')
          text = current.read_text()
          anchor = '          inputMode: "station-attack",\n          stationResourceId: "stress-pistol-control",'
          replacement = '          inputMode: "station-attack",\n          runtimeSystem: "station-hitscan-v1",\n          stationResourceId: "stress-pistol-control",'
          assert text.count(anchor) == 1, text.count(anchor)
          current.write_text(text.replace(anchor, replacement))

          print('remove duplicate stress firing authority')
          stress = Path('public/src/vessel/systems/stress-test-vessel-system.js')
          text = stress.read_text()
          removable = [
            'import {vesselLocalToWorld} from "../vessel-interior.js";\n',
            'import {listCombatTargets, resolveCombatTarget} from "../../free-roam-targeting.js?v=39";\n',
            'import {applyBoatDamage} from "../../collision-model.js";\n',
            'import {applyCombatDamage} from "../../free-roam-combat-v2.js?v=6";\n',
            'import {damageEnemyBoat} from "../../free-roam-enemy-boats.js?v=3";\n',
            'import {damageEscort} from "../../free-roam-pursuer-squad.js?v=33";\n',
            'import {damageHostileGunner} from "../../free-roam-hostile-gunners.js?v=32";\n',
            'import {damageHostileActor} from "../../free-roam-hostile-actors.js?v=3";\n',
            'import {damageHeavyPursuer} from "../../free-roam-heavy-pursuer.js?v=4";\n',
            'import {damageEliteBoatBoss} from "../../free-roam-elite-boat.js?v=2";\n',
            'import {releaseStolenCargo} from "../../free-roam-marauder.js?v=33";\n',
            'const clamp = (value, minimum, maximum) => Math.max(minimum, Math.min(maximum, Number(value) || 0));\n',
            'const rad = value => Number(value) * Math.PI / 180;\n',
          ]
          for line in removable:
            assert text.count(line) == 1, line
            text = text.replace(line, '')

          start = text.index('function currentInput(world, playerIndex) {')
          end = text.index('function announceBoarding(context) {')
          bridge = '''function stressMountedWeapon(entry) {
            const definition = entry?.definition?.modules?.find(module => (
              module?.type === "mounted-weapon" && module?.id === "stress-pistol"
            ));
            if (!definition) return null;
            const state = entry.instance?.modules?.[definition.id];
            return state ? {definition, state} : null;
          }

          function syncStressAmmo({nativeVessels} = {}) {
            for (const entry of nativeVessels || []) {
              if (entry?.definition?.id !== STRESS_TEST_VESSEL_TYPE || !entry?.boat) continue;
              const mounted = stressMountedWeapon(entry);
              if (!mounted) continue;
              if (!mounted.state.stressAmmoHydrated) {
                const persistedAmmo = Number(entry.boat.testWeaponAmmo);
                if (Number.isFinite(persistedAmmo) && persistedAmmo >= 0) mounted.state.ammo = Math.floor(persistedAmmo);
                mounted.state.stressAmmoHydrated = true;
              }
              entry.boat.testWeaponAmmo = Math.max(0, Math.floor(Number(mounted.state.ammo) || 0));
            }
          }

          '''
          text = text[:start] + bridge + text[end:]
          pattern = re.compile(
            r'  Object\.freeze\(\{\n'
            r'    id: "stress-test-mounted-pistol-v3",\n'
            r'    phase: "before-step",\n'
            r'    order: 10,\n'
            r'    run: updateMountedWeapons,\n'
            r'  \}\),'
          )
          new_systems = '''  Object.freeze({
            id: "stress-test-ammo-bridge-v1",
            phase: "before-step",
            order: 9,
            run: syncStressAmmo,
          }),
          Object.freeze({
            id: "stress-test-ammo-bridge-after-step-v1",
            phase: "after-step",
            order: 9,
            run: syncStressAmmo,
          }),'''
          text, count = pattern.subn(new_systems, text)
          assert count == 1, count
          assert 'updateMountedWeapons' not in text
          assert 'stress-test-mounted-pistol' not in text
          stress.write_text(text)

          print('bump manifest cache paths')
          content = Path('public/src/vessel/vessel-content-manifest.js')
          text = content.read_text()
          assert text.count('current-vessels.js?v=3') == 1
          content.write_text(text.replace('current-vessels.js?v=3', 'current-vessels.js?v=4'))

          plugin = Path('public/src/vessel/vessel-plugin-manifest.js')
          text = plugin.read_text()
          assert text.count('stress-test-vessel-system.js?v=2') == 1
          plugin.write_text(text.replace('stress-test-vessel-system.js?v=2', 'stress-test-vessel-system.js?v=3'))

          html = Path('public/free-roam.html')
          text = html.read_text()
          old_content = '"/src/vessel/vessel-content-manifest.js?v=2": "/src/vessel/vessel-content-manifest.js?v=4"'
          old_plugin = '"/src/vessel/vessel-plugin-manifest.js?v=2": "/src/vessel/vessel-plugin-manifest.js?v=7"'
          assert text.count(old_content) == 1, text.count(old_content)
          assert text.count(old_plugin) == 1, text.count(old_plugin)
          text = text.replace(old_content, '"/src/vessel/vessel-content-manifest.js?v=2": "/src/vessel/vessel-content-manifest.js?v=5"')
          text = text.replace(old_plugin, '"/src/vessel/vessel-plugin-manifest.js?v=2": "/src/vessel/vessel-plugin-manifest.js?v=8"')
          html.write_text(text)

          print('release metadata')
          package = Path('package.json')
          data = json.loads(package.read_text())
          assert data['version'] == '1.7.16'
          data['version'] = '1.7.17'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > tests/vessel-mounted-weapon-live-path.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";

          import {ensureCombat} from "../public/src/free-roam-combat-v2.js";
          import {CURRENT_VESSEL_TYPES} from "../public/src/vessel/definitions/current-vessels.js";
          import {STRESS_TEST_VESSEL_SYSTEMS} from "../public/src/vessel/systems/stress-test-vessel-system.js";
          import {VESSEL_MOUNTED_WEAPON_SYSTEMS} from "../public/src/vessel/systems/vessel-mounted-weapon-system.js";
          import {STRESS_TEST_VESSEL_TYPE} from "../public/src/vessel/stress-test-vessel-config.js";

          function liveContext() {
            const definition = CURRENT_VESSEL_TYPES.find(candidate => candidate.id === STRESS_TEST_VESSEL_TYPE);
            assert.ok(definition);
            const pistol = definition.modules.find(module => module.id === "stress-pistol");
            assert.equal(pistol.config.runtimeSystem, "station-hitscan-v1");

            const boat = {
              id: 0,
              boatType: STRESS_TEST_VESSEL_TYPE,
              vesselType: STRESS_TEST_VESSEL_TYPE,
              audioProfile: "stress-test-50",
              x: 100,
              y: 100,
              heading: 0,
              sunk: false,
              reserved: false,
              testWeaponAmmo: 100,
            };
            const world = {
              time: 10,
              boats: [boat],
              events: [],
              players: [
                {x: 100, y: 100, heading: 0, mode: "boat", activeBoat: 0},
                {x: 100, y: 340, heading: 180, mode: "foot", activeBoat: null},
              ],
              freeActivities: {presence: [true, true], inputs: [{}, {}]},
              operationInputs: [{}, {}],
              inputs: [{}, {}],
            };
            ensureCombat(world);
            world.players[0].combat.lockedTargetId = "player-1";
            const entry = {
              definition,
              boat,
              instance: {
                modules: {"stress-pistol": {enabled: true, health: 100, ammo: 100, cooldown: 0}},
                occupants: {0: {deckId: "stress-control-deck", x: 1.15, y: 1.15}},
                interior: {
                  claims: {"stress-pistol-control": 0},
                  walkableControl: {inputs: {"0": {attack: true}}},
                },
              },
            };
            return {world, entry};
          }

          test("stress pistol has only the shared firing authority", () => {
            assert.equal(STRESS_TEST_VESSEL_SYSTEMS.some(system => system.id.includes("mounted-pistol")), false);
          });

          test("real far stress-pistol shot uses distance falloff once", () => {
            const {world, entry} = liveContext();
            const before = [...STRESS_TEST_VESSEL_SYSTEMS, ...VESSEL_MOUNTED_WEAPON_SYSTEMS]
              .filter(system => system.phase === "before-step")
              .sort((left, right) => left.order - right.order || left.id.localeCompare(right.id));
            for (const system of before) system.run({world, dt: 0.04, eventStart: 0, nativeVessels: [entry]});

            const after = STRESS_TEST_VESSEL_SYSTEMS
              .filter(system => system.phase === "after-step")
              .sort((left, right) => left.order - right.order || left.id.localeCompare(right.id));
            for (const system of after) system.run({world, dt: 0.04, eventStart: 0, nativeVessels: [entry]});

            const shots = world.events.filter(event => event.type === "vessel-mounted-shot");
            assert.equal(shots.length, 1);
            assert.equal(shots[0].targetId, "player-1");
            assert.equal(shots[0].hit, true);
            assert.equal(shots[0].applied, true);
            assert.equal(shots[0].damage, 1.2);
            assert.equal(world.players[1].combat.health, 98.8);
            assert.equal(entry.instance.modules["stress-pistol"].ammo, 99);
            assert.equal(entry.boat.testWeaponAmmo, 99);
          });
          EOF

          cat > RELEASE_NOTES.md <<'EOF'
          # Echo Archipelago 1.7.17

          Дата релиза: 2026-08-16

          ## Исправлено

          - Реальный дальний выстрел установки «Пятьдесят» теперь проходит через общую `station-hitscan-v1` систему и получает падение урона из 1.7.16.
          - Удалена параллельная власть `stress-test-mounted-pistol-v3`, которая стреляла раньше общей системы и всегда наносила полный урон 6.
          - Старый stress-плагин оставлен только для появления катера, совместимости боезапаса и сообщений посадки.
          - Числа баланса 1.7.16 не менялись: 6 вблизи, падение после 55 метров и 1,2 начиная с 220 метров.
          - Добавлен regression-тест полного серверного выстрела на дальней дистанции и запрет возврата второго обработчика установки.
          - Обновлены cache-buster-версии определений и плагина через существующую цепочку import map.

          Подробности: `RELEASE_1.7.17.md`.

          Предыдущий релиз: `RELEASE_1.7.16.md`.
          EOF

          cat > RELEASE_1.7.17.md <<'EOF'
          # Echo Archipelago 1.7.17 — живое падение урона «Пятьдесят»

          Дата релиза: 2026-08-16

          ## Дефект

          Реальный журнал после 1.7.16 показал настоящие попадания `stress-pistol` примерно на 154, 222, 239, 266 и 288 метрах, и они всё равно давали по 6 урона. По правилам 1.7.16 после 55 метров урон должен уменьшаться, а с 220 метров составлять 1,2.

          ## Корневая причина

          У испытательного катера оставался старый отдельный обработчик `stress-test-mounted-pistol-v3`. Он выполнялся раньше общей системы корабельных установок, сам наносил `config.damage` и выставлял cooldown. Кроме того, конкретная установка ещё не была помечена как пользователь общей `station-hitscan-v1` системы.

          В результате правильная формула падения урона существовала и проходила отдельный математический тест, но живой выстрел «Пятьдесят» до неё не доходил.

          ## Исправление

          `stress-pistol` явно подключён к уже существующему runtime `station-hitscan-v1`.

          Старый stress-плагин больше не выбирает цель и не наносит урон. Он отвечает только за появление испытательного катера, совместимость старого `testWeaponAmmo` и сообщения посадки. Совместимость боезапаса сохранена отдельным мостом до и после шага; этот мост не имеет права наносить урон.

          Числа баланса не менялись: 6 урона вблизи, интервал 0,04 секунды, дальность 320 метров и 1,2 урона начиная с 220 метров.

          ## Проверка

          Новый regression-тест запускает stress-системы и общую систему в реальном порядке, создаёт живую цель на дальней дистанции и требует ровно один `vessel-mounted-shot` с фактическим уроном 1,2. Отдельно тест запрещает возврат системы `stress-test-mounted-pistol` и проверяет синхронизацию боезапаса.

          Перед публикацией должны пройти `npm test`, архитектурные проверки, двухклиентные браузерные сценарии и dry-run Worker.

          После публикации нужен короткий ручной проход примерно на 230–300 метрах и новый журнал: настоящие попадания должны показывать около 1,2, а не 6. Физический iPhone, VoiceOver и субъективное ощущение баланса автоматическими тестами не подтверждаются.

          ## Не изменено

          Не менялись HP босса, его ИИ, мега-бомбы, угрозы 3–4, ручное возрождение, звук, сеть или скорострельность установки.

          Предыдущий релиз: `RELEASE_1.7.16.md`.
          EOF

          git rm .github/workflows/temp-patch-1.7.17.yml .github/workflows/temp-patch-1.7.17-v2.yml

      - name: Verify syntax and tests
        run: |
          node --check public/src/vessel/definitions/current-vessels.js
          node --check public/src/vessel/systems/stress-test-vessel-system.js
          node --check tests/vessel-mounted-weapon-live-path.test.mjs
          npm ci
          npm test

      - name: Commit generated bugfix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Исправлен живой дистанционный урон установки «Пятьдесят»" -m "Удалён старый параллельный обработчик выстрела, установка подключена к общей station-hitscan системе, добавлен интеграционный тест и релиз 1.7.17."
          git push origin HEAD:fix/stress-pistol-live-falloff-1.7.17
