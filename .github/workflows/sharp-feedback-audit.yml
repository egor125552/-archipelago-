name: Sharp feedback audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps webkit
      - name: Run delayed desktop WebKit audit
        shell: bash
        run: |
          npx wrangler dev --local --port 8787 --log-level error >sharp-worker.log 2>&1 &
          WORKER_PID=$!
          node tests/sharp-feedback-jitter-proxy.mjs >sharp-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill $WORKER_PID $PROXY_PID || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent 'http://127.0.0.1:8787/api/rooms?mode=free' >/dev/null; then break; fi
            sleep 1
          done
          node tests/sharp-feedback-browser-audit.mjs
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharp-feedback-audit
          path: |
            sharp-feedback-result.json
            sharp-worker.log
            sharp-proxy.log
          if-no-files-found: ignore
