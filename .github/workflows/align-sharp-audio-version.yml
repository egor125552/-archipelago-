name: Align sharp audio version

on:
  pull_request:

permissions:
  contents: write

jobs:
  align:
    if: github.head_ref == 'sharp-action-feedback-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sharp-action-feedback-20260725
      - name: Align wrappers with live audio class
        run: python .github/scripts/align-sharp-audio-version.py
      - name: Commit alignment
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/src/free-roam-sharp-feedback-v1.js public/src/free-roam-pistol-audio.js tests/free-roam-sharp-feedback.test.mjs
          git commit -m "Align sharp feedback with live audio class"
          git push origin HEAD:sharp-action-feedback-20260725
